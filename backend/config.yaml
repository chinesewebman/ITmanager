server:
  host: 0.0.0.0
  port: 8080
  mode: debug
  # C-P5: 是否暴露 /metrics 端点（生产环境建议开启供 Prometheus 抓取）
  metrics_enabled: true
  # G-7: 反向代理来源（CIDR 或裸 IP）。空 = 不信任任何来源，ClientIP() 取直连对端、
  # 忽略 X-Forwarded-For —— 直连部署下这是正确值。
  # 部署在反向代理后**必须**填代理的 IP/CIDR（如容器化部署填 nginx 容器 IP），否则：
  # 登录限流退化为全站单桶（一个攻击者可耗尽所有人的配额）、审计 IP 变成代理地址、
  # 配了 IP 白名单的 API Key 一律 403。详见 docs/FIX-PLAN-TRUSTED-PROXY.md。
  # 环境变量覆盖：NMP_SERVER_TRUSTED_PROXIES=172.28.0.10,10.0.1.5
  trusted_proxies: []

database:
  host: "localhost"
  port: 5432
  user: "nmp"
  # F1: 默认空值，由 NMP_DATABASE_PASSWORD 环境变量注入。CI/dev 用 .env.example
  password: ""
  name: "network_monitor"
  # F1: release 模式建议 require 或 verify-full
  sslmode: "disable"

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

# 第三方系统集成
# F1: 默认占位；生产环境必须通过 NMP_INTEGRATIONS_*_TOKEN 环境变量注入
integrations:
  netbox:
    url: "http://localhost:8000"
    token: ""

  zabbix:
    url: "http://localhost:8080"
    user: "Admin"
    password: "zabbix"

  glpi:
    url: "http://localhost"
    app_token: ""
    user_token: ""

# 认证
# F1+F3: auth.jwt.secret 启动时由 Validate() 校验长度 >= 32 且非占位
# 通过 NMP_AUTH_JWT_SECRET 注入 32+ 字符随机串：
#   openssl rand -hex 32
auth:
  jwt:
    secret: ""  # 必须从环境变量 NMP_AUTH_JWT_SECRET 注入
    expire: 86400  # 24小时 (秒)
  # F1/C-F6: API Key 的 HMAC pepper，必须从环境变量 NMP_AUTH_API_KEY_PEPPER 注入。
  # 这个空占位是**双保险**：viper 只对 AllKeys（yaml 键 + SetDefault 键）做 env 覆盖，
  # 键不存在时 NMP_AUTH_API_KEY_PEPPER 会被静默忽略、服务永远起不来（G-13）。
  # 功能上的保证来自 config.go 的 `SetDefault("auth.api_key_pepper","")`（覆盖
  # 「生产挂载了不含该键的旧/自定义 config.yaml」）；这里留着是为了让 shipped 配置
  # 自解释。变异反证：单独删这一行不会让任何测试变红，删 SetDefault 才会。
  # 不要在这里写死值——pepper 落仓会削弱防离线彩虹表的意义。
  api_key_pepper: ""
  ldap:
    enabled: false
    url: "ldap://localhost:389"
    base_dn: "dc=company,dc=com"
    bind_user: ""
    bind_password: ""

# CORS
# F4: 允许的来源，逗号分隔。release 模式必填
allowed_origins:
  - "http://localhost:5173"
  - "http://localhost:3000"

# 通知
notifications:
  smtp:
    enabled: false
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    smtp_user: ""
    smtp_password: ""
    from: "noreply@company.com"

log:
  level: "info"  # debug / info / warn / error
  format: "json"  # json / text
