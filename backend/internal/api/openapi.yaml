          type: string
        severity:
          type: integer
        title:
          type: string
        description:
          type: string
        ref_id:
          type: string
          format: uuid
        ref_table:
          type: string
    DiagnosticAsset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        asset_tag:
          type: string
        asset_type:
          type: string
        brand:
          type: string
        model:
          type: string
        status:
          type: string
        site_id:
          type: string
          format: uuid
        site_name:
          type: string
        rack_id:
          type: string
          format: uuid
        rack_name:
          type: string
    DiagnosticSummary:
      type: object
      properties:
        alert_count:
          type: integer
        ticket_count:
          type: integer
        open_alerts:
          type: integer
        open_tickets:
          type: integer
        last_offline:
          type: string
          format: date-time
        last_online:
          type: string
          format: date-time
        mttr_seconds:
          type: integer
          nullable: true
        link_down_count:
          type: integer
        window_days:
          type: integer
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        asset_id:
          type: string
          format: uuid
    DiagnosticTimeline:
      type: object
      properties:
        asset:
          $ref: '#/components/schemas/DiagnosticAsset'
        events:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'
        summary:
          $ref: '#/components/schemas/DiagnosticSummary'

    PingResult:
      type: object
      properties:
        host:
          type: string
        count:
          type: integer
        transmitted:
          type: integer
        received:
          type: integer
        loss_percent:
          type: number
