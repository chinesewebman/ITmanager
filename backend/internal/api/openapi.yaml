openapi: 3.0.3
info:
  title: 网络运维监控平台 API
  description: |
    网络运维监控平台后端API规范，基于RESTful设计风格。

    ## 认证方式
    - 所有API需要通过Header传递API Key：`Authorization: Bearer <token>`
    - 登录接口返回token

    ## 响应格式
    所有接口统一响应格式：
    ```json
    {
      "code": 0,
      "message": "success",
      "data": {}
    }
    ```
  version: 1.0.0
  contact:
    name: IT Manager Team

servers:
  - url: http://localhost:8080/api
    description: 本地开发环境
  - url: http://localhost/api
    description: 生产环境

tags:
  - name: 认证
    description: 登录、登出相关接口
  - name: 仪表盘
    description: 统计和趋势数据
  - name: 资产管理
    description: 资产CRUD操作
  - name: 告警中心
    description: 告警列表、确认、解决
  - name: 机房机柜
    description: 机房、机柜管理
  - name: 工单管理
    description: 工单相关接口
  - name: 用户管理
    description: 用户列表、详情
  - name: 通知设置
    description: 通知渠道管理
  - name: 系统
    description: 存活探针
  - name: 集成管理
    description: NetBox / Zabbix / GLPI 配置与同步

paths:
  # ==================== 认证 ====================
  /auth/login:
    post:
      tags:
        - 认证
      summary: 用户登录
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  description: 用户名
                password:
                  type: string
                  description: 密码
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /auth/logout:
    post:
      tags:
        - 认证
      summary: 用户登出
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 登出成功

  /auth/skip-password-change:
    post:
      tags:
        - 认证
      summary: 确认无强制改密待办 (幂等)
      description: |
        C7: 用户在 `/change-password` 页点"跳过"时调用。

        判据是服务端的 `users.must_change_password`，**不看请求体的 reason**（客户端可伪造）：
        - `must_change_password=true` → 400（主人 7/02 决策：首次登录 / 管理员重置后的强制改密不可跳）
        - `must_change_password=false` → 200，幂等且**不写任何状态**（不再写 password_set_at）

        修复前只拒绝 `reason=="first_login"` 字面量，空 body 或 `reason=optional` 即可清 flag
        绕过强改密（见 docs/FIX-PLAN-AUTHZ-LEFTOVER.md S-1）。
      operationId: skipPasswordChange
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  deprecated: true
                  description: 已废弃：服务端不再读取，保留仅为兼容既有客户端请求体
                  example: optional
      responses:
        '200':
          description: 当前无强制改密待办
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: 当前无需改密
        '400':
          description: 当前账号处于强制改密状态, 不允许跳过

  # ==================== 仪表盘 ====================
  /dashboard/stats:
    get:
      tags:
        - 仪表盘
      summary: 获取仪表盘统计
      operationId: getDashboardStats
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'

  /dashboard/trends:
    get:
      tags:
        - 仪表盘
      summary: 获取告警趋势
      operationId: getDashboardTrends
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardTrends'

  /dashboard/kpis:
    get:
      tags:
        - 仪表盘
      summary: 获取关键 KPI 指标
      description: |
        返回 MTTR (平均恢复时间)、MTTD (平均检测时间)、告警密度、SLA 达成率。
        days 默认 7，范围 1-90。
      operationId: getKPIs
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 7
            minimum: 1
            maximum: 90
          description: 窗口天数，默认 7，范围 1-90
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPI'
        '400':
          description: 请求参数错误

  # ==================== 资产管理 ====================
  /assets:
    get:
      tags:
        - 资产管理
      summary: 获取资产列表
      operationId: listAssets
      parameters:
        - name: site_id
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
        - name: keyword
          in: query
          description: 按名称/资产标签/序列号模糊匹配（name/asset_tag/sn）
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetList'

    post:
      tags:
        - 资产管理
      summary: 创建资产
      operationId: createAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'

  /assets/{id}:
    get:
      tags:
        - 资产管理
      summary: 获取资产详情
      operationId: getAsset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'

    put:
      tags:
        - 资产管理
      summary: 更新资产
      operationId: updateAsset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetInput'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'

    delete:
      tags:
        - 资产管理
      summary: 删除资产
      operationId: deleteAsset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 删除成功

  # ==================== 告警中心 ====================
  /alerts:
    get:
      tags:
        - 告警中心
      summary: 获取告警列表
      operationId: listAlerts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [problem, acknowledged, resolved]
        - name: severity
          in: query
          schema:
            type: integer
        - name: host_id
          in: query
          schema:
            type: string
        # limit/cursor 是 handler 一直支持但 spec 漏记的参数（G-37 同类）。
        # 前端仪表盘「最近告警」用 limit=5 取最新几条，类型需与实现对齐。
        - name: limit
          in: query
          description: 返回条数上限，默认 100，上限 1000
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: cursor
          in: query
          description: v2.0 游标分页，取上一页响应的 next_cursor；解码失败时降级为忽略
          schema:
            type: string
        - name: page
          in: query
          description: 页码（>0 走 offset 分页；不传走 limit 上限语义，向后兼容）
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          description: 每页条数，默认 20，上限 500
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertList'

  /alerts/{id}:
    get:
      tags:
        - 告警中心
      summary: 获取告警详情
      operationId: getAlert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '400':
          description: ID 格式错误（必须是 UUID）
        '404':
          description: 告警不存在

  /alerts/{id}/ack:
    put:
      tags:
        - 告警中心
      summary: 确认告警
      operationId: acknowledgeAlert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 确认成功
        '400':
          description: ID 格式错误（必须是 UUID）
        '404':
          description: 告警不存在
        '409':
          description: 告警当前状态不允许确认（如已解决的告警）

  /alerts/{id}/resolve:
    put:
      tags:
        - 告警中心
      summary: 解决告警
      operationId: resolveAlert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 解决成功
        '400':
          description: ID 格式错误（必须是 UUID）
        '404':
          description: 告警不存在
        '409':
          description: 告警当前状态不允许解决

  /alerts/{id}/mark-fp:
    post:
      tags:
        - 告警中心
      summary: 标记/反标记告警为误报
      operationId: markFalsePositive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_false_positive]
              properties:
                is_false_positive:
                  type: boolean
                  description: true=标记为误报，false=反标记
                note:
                  type: string
                  description: 误报备注（如"周期性抖动"）
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '400':
          description: ID 格式错误（必须是 UUID）
        '404':
          description: 告警不存在

  /alerts/{id}/ticket:
    post:
      tags:
        - 告警中心
      summary: 从告警一键建单
      description: |
        由人点「建单」触发，把告警现场信息派生成一张 incident 工单，并回写
        `alerts.ticket_id`（ADR-0004：工单 SoT 在后端，建单必须由人显式发起）。
        **幂等**：同一告警重复调用不会建出第二张票，返回既有那张。

        响应码区分首次与重复：`201` = 本次新建，`200` = 该告警已有关联工单，
        前端据此决定是否提示「已建单」。
      operationId: createTicketFromAlert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: 本次新建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertTicketResult'
        '200':
          description: 告警已有关联工单，幂等返回既有那张（created=false）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertTicketResult'
        '404':
          description: 告警不存在，或其关联的工单已失效

  /alerts/false-positives/export:
    get:
      tags:
        - 告警中心
      summary: 导出误报训练集 CSV
      operationId: exportFalsePositives
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: 可选 RFC3339 时间，增量导出 marked_at >= since 的记录
      responses:
        '200':
          description: CSV 文件流
          content:
            text/csv:
              schema:
                type: string

  /alerts/stats:
    get:
      tags:
        - 告警中心
      summary: 获取告警统计
      operationId: getAlertStats
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertStats'

  # ==================== 告警规则 ====================
  /alert-rules:
    get:
      tags:
        - 告警中心
      summary: 获取告警规则列表
      operationId: listAlertRules
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRuleList'

    post:
      tags:
        - 告警中心
      summary: 创建告警规则
      operationId: createAlertRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleInput'
      responses:
        '201':
          description: 创建成功

  /alert-rules/{id}:
    put:
      tags:
        - 告警中心
      summary: 更新告警规则
      operationId: updateAlertRule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleInput'
      responses:
        '200':
          description: 更新成功

    delete:
      tags:
        - 告警中心
      summary: 删除告警规则
      operationId: deleteAlertRule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 删除成功

  # ==================== 机房 ====================
  /sites:
    get:
      tags:
        - 机房机柜
      summary: 获取机房列表
      operationId: listSites
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteList'

  /sites/{id}:
    get:
      tags:
        - 机房机柜
      summary: 获取机房详情
      operationId: getSite
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteDetail'

  # ==================== 机柜 ====================
  /racks:
    get:
      tags:
        - 机房机柜
      summary: 获取机柜列表
      operationId: listRacks
      parameters:
        - name: site_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RackList'

  /racks/{id}:
    get:
      tags:
        - 机房机柜
      summary: 获取机柜详情
      operationId: getRack
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rack'

  /racks/{id}/devices:
    get:
      tags:
        - 机房机柜
      summary: 获取机柜内设备
      operationId: getRackDevices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RackDeviceList'

  # ==================== 工单 ====================
  /tickets:
    get:
      tags:
        - 工单管理
      summary: 获取工单列表
      operationId: listTickets
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketList'

    post:
      tags:
        - 工单管理
      summary: 创建工单
      operationId: createTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketInput'
      responses:
        '201':
          description: 创建成功

  /tickets/{id}:
    get:
      tags:
        - 工单管理
      summary: 获取工单详情
      operationId: getTicket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'

    put:
      tags:
        - 工单管理
      summary: 更新工单
      operationId: updateTicket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketInput'
      responses:
        '200':
          description: 更新成功

  # M25 经手历史。准入与 GET /tickets/{id} 同级（「跟工单本身的可见性」，用户 2026-09-11 拍板③）——
  # 这与 GET /audit-logs 收在 canAudit 的先例相反，是有意放宽，见 docs/FIX-PLAN-TICKET-HISTORY.md §2.6。
  /tickets/{id}/history:
    get:
      tags:
        - 工单管理
      summary: 获取工单经手历史
      operationId: listTicketHistory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          description: 每页条数，默认 20，上限 500（超出由 service 层夹住）
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketHistoryList'
        '404':
          description: 工单不存在（不返回空列表 —— 那会被读成「这张票还没被改过」）

  # ==================== 用户 ====================
  /users:
    get:
      tags:
        - 用户管理
      summary: 获取用户列表
      operationId: listUsers
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'

  /users/{id}:
    get:
      tags:
        - 用户管理
      summary: 获取用户详情
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  # ==================== 通知渠道 ====================
  /notification-channels:
    get:
      tags:
        - 通知设置
      summary: 获取通知渠道列表
      operationId: listChannels
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelList'

    post:
      tags:
        - 通知设置
      summary: 创建通知渠道
      operationId: createChannel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelInput'
      responses:
        '201':
          description: 创建成功

  /notification-channels/{id}:
    put:
      tags:
        - 通知设置
      summary: 更新通知渠道
      operationId: updateChannel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelInput'
      responses:
        '200':
          description: 更新成功

    delete:
      tags:
        - 通知设置
      summary: 删除通知渠道
      operationId: deleteChannel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 删除成功

  /notification-channels/{id}/test:
    put:
      tags:
        - 通知设置
      summary: 测试通知渠道
      operationId: testChannel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 测试消息已发送

  /diagnostics/assets/{id}/timeline:
    get:
      tags:
        - 资产诊断
      summary: 获取资产时间线（用于故障诊断）
      description: |
        聚合 alerts / tickets / assets / asset_networks 四张表，按时间倒序返回事件流。
        含 MTTR (平均恢复时间)、open_alerts、open_tickets 等摘要。
      operationId: getAssetTimeline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 30
            maximum: 365
          description: 查询窗口（天）默认 30，最大 365
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
            maximum: 1000
          description: 事件数上限，默认 200，最大 1000
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticTimeline'
        '400':
          description: 请求参数错误
        '404':
          description: 资产不存在

  /diagnostics/ping:
    get:
      tags:
        - 资产诊断
      summary: 资产 ICMP ping 探活
      description: |
        调用系统 ping 工具探测资产 IP 的可达性。
        count 默认 4，上限 20。响应包含 transmitted/received/loss/min/avg/max ms。
      operationId: pingAsset
      parameters:
        - name: host
          in: query
          required: true
          schema:
            type: string
          description: 目标 host（IP 或 hostname）
        - name: count
          in: query
          required: false
          schema:
            type: integer
            default: 4
            maximum: 20
          description: ping 次数，默认 4，上限 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResult'
        '400':
          description: 请求参数错误
        '500':
          description: ping 执行失败

  /diagnostics/traceroute:
    get:
      tags:
        - 资产诊断
      summary: 资产 traceroute 网络路径
      description: |
        调用系统 traceroute 跟踪资产 IP 的网络路径。
        maxHops 默认 30，上限 64。
      operationId: tracerouteAsset
      parameters:
        - name: host
          in: query
          required: true
          schema:
            type: string
          description: 目标 host（IP 或 hostname）
        - name: maxHops
          in: query
          required: false
          schema:
            type: integer
            default: 30
            maximum: 64
          description: 最大跳数，默认 30，上限 64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TracerouteResult'
        '400':
          description: 请求参数错误
        '500':
          description: traceroute 执行失败

  /postmortem/assets/{id}/report:
    get:
      tags:
        - 资产复盘
      summary: 下载资产复盘 PDF 报告
      description: |
        聚合 alerts / tickets / status 历史生成 1-2 页 PDF 复盘报告。
        报告含：资产概要、可靠性指标（MTTR/告警密度）、事件时间线、Top 5 告警。
        days 默认 30，上限 365。
      operationId: downloadPostmortemReport
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 30
            maximum: 365
          description: 查询窗口（天）默认 30，最大 365
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
            maximum: 1000
          description: 事件数上限，默认 200，最大 1000
      responses:
        '200':
          description: PDF 文件流
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: 请求参数错误
        '404':
          description: 资产不存在
        '500':
          description: 报告生成失败

  /alert-suppressions:
    get:
      tags:
        - 告警抑制
      summary: 列出告警抑制规则
      operationId: listAlertSuppressions
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertSuppression'
    post:
      tags:
        - 告警抑制
      summary: 创建告警抑制规则
      operationId: createAlertSuppression
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertSuppression'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSuppression'
        '400':
          description: 参数错误

  /alert-suppressions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - 告警抑制
      summary: 获取单条告警抑制规则
      operationId: getAlertSuppression
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSuppression'
        '404':
          description: 不存在
    put:
      tags:
        - 告警抑制
      summary: 更新告警抑制规则
      operationId: updateAlertSuppression
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSuppression'
        '400':
          description: 参数错误
    delete:
      tags:
        - 告警抑制
      summary: 删除告警抑制规则
      operationId: deleteAlertSuppression
      responses:
        '204':
          description: 删除成功

  /alert-suppressions/preview:
    post:
      tags:
        - 告警抑制
      summary: 模拟评估一条告警是否被抑制
      operationId: previewSuppression
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [severity, host_id, host_name]
              properties:
                severity:
                  type: integer
                  minimum: 1
                  maximum: 5
                host_id:
                  type: string
                  format: uuid
                host_name:
                  type: string
      responses:
        '200':
          description: 评估结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuppressionMatchResult'

  /topology:
    get:
      tags:
        - 网络拓扑
      summary: 获取网络拓扑图
      description: 聚合 assets + asset_networks + alerts，自动布局 (环形) + 虚拟节点标记
      operationId: getTopology
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 30
            maximum: 365
        - name: only_with_alerts
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: asset_types
          in: query
          required: false
          schema:
            type: string
          description: 逗号分隔，如 "server,switch"
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyGraph'

  /oncall/current:
    get:
      tags:
        - 值班
      summary: 获取当前在班的 user
      operationId: getCurrentOncall
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OncallCurrent'

  /oncall/schedules:
    get:
      tags:
        - 值班
      summary: 列出值班组
      operationId: listOncallSchedules
      responses:
        '200':
          description: 成功
    post:
      tags:
        - 值班
      summary: 创建值班组
      operationId: createOncallSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OncallSchedule'
      responses:
        '201':
          description: 创建成功

  /oncall/schedules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags:
        - 值班
      summary: 删除值班组（级联删 shifts）
      operationId: deleteOncallSchedule
      responses:
        '204':
          description: 成功

  /oncall/schedules/{id}/shifts:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - 值班
      summary: 列出 schedule 下所有班次
      operationId: listOncallShifts
      responses:
        '200':
          description: 成功
    post:
      tags:
        - 值班
      summary: 创建班次
      operationId: createOncallShift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OncallShift'
      responses:
        '201':
          description: 创建成功

  /oncall/shifts/{shift_id}:
    parameters:
      - name: shift_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags:
        - 值班
      summary: 删除班次
      operationId: deleteOncallShift
      responses:
        '204':
          description: 成功

  /oncall/policies:
    get:
      tags:
        - 升级策略
      summary: 列出升级策略
      operationId: listEscalationPolicies
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EscalationPolicy'
    post:
      tags:
        - 升级策略
      summary: 创建升级策略（含 levels）
      operationId: createEscalationPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalationPolicy'
      responses:
        '201':
          description: 创建成功

  /oncall/policies/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - 升级策略
      summary: 获取单条升级策略
      operationId: getEscalationPolicy
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationPolicy'
    delete:
      tags:
        - 升级策略
      summary: 删除升级策略
      operationId: deleteEscalationPolicy
      responses:
        '204':
          description: 成功

  # ==================== 故障 Runbook（P2-1）====================
  /runbooks:
    get:
      tags:
        - Runbook
      summary: 列出 Runbook
      operationId: listRunbooks
      parameters:
        - name: asset_type
          in: query
          schema: { type: string }
        - name: severity
          in: query
          schema: { type: integer }
        - name: enabled
          in: query
          schema: { type: boolean }
        - name: keyword
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Runbook' }
                  total: { type: integer }
    post:
      tags: [Runbook]
      summary: 创建 Runbook
      operationId: createRunbook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Runbook' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Runbook' }
        '400': { description: 参数错误 }
  /runbooks/recommend:
    get:
      tags: [Runbook]
      summary: 按告警推荐 Runbook
      operationId: recommendRunbooks
      parameters:
        - name: asset_type
          in: query
          schema: { type: string }
        - name: severity
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: 推荐列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Runbook' }
  /runbooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Runbook]
      summary: 获取 Runbook
      operationId: getRunbook
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Runbook' }
        '404': { description: 不存在 }
    put:
      tags: [Runbook]
      summary: 更新 Runbook
      operationId: updateRunbook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Runbook' }
      responses:
        '200': { description: 成功 }
        '400': { description: 参数错误 }
        '404': { description: 不存在 }
    delete:
      tags: [Runbook]
      summary: 删除 Runbook
      operationId: deleteRunbook
      responses:
        '204': { description: 成功 }
        '404': { description: 不存在 }

  # ==================== 指标快照（P2-2）====================
  /metric-snapshots:
    get:
      tags: [指标快照]
      summary: 时序查询
      operationId: queryMetricSnapshots
      parameters:
        - name: asset_id
          in: query
          schema: { type: string, format: uuid }
        - name: key
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, default: 1000 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MetricSnapshot' }
    post:
      tags: [指标快照]
      summary: 批量插入
      operationId: bulkInsertMetricSnapshots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/MetricSnapshot' }
      responses:
        '201': { description: 插入成功 }
        '400': { description: 参数错误 }
  /metric-snapshots/latest:
    get:
      tags: [指标快照]
      summary: 取 asset+key 最新 N 个点
      operationId: latestMetricSnapshots
      parameters:
        - name: asset_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: key
          in: query
          required: true
          schema: { type: string }
        - name: n
          in: query
          schema: { type: integer, default: 60 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MetricSnapshot' }

  # ==================== 系统探针 ====================
  /health:
    get:
      tags: [系统]
      summary: 存活探针（旧路径兼容）
      description: |
        内部转发到 `GET /healthz`：只确认进程能响应 HTTP，**不依赖 DB / 外部服务**，故恒 200。
        K8s livenessProbe 用组外 `/healthz`；本路径供仍引用旧地址的 manifest 兼容。
      operationId: getHealth
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  # ==================== 集成管理（v2.2）====================
  /integrations/status:
    get:
      tags: [集成管理]
      summary: 获取集成配置状态
      description: |
        返回 NetBox / Zabbix / GLPI 的 `enabled` + `url`（Zabbix 另含 `user`）。
        `has_*` 布尔位**仅 canManage 角色**（admin / ops_admin）可见 —— 它们泄露
        「凭据是否已配置」，对 readonly / auditor / user 不返回。
        ⚠️ 回传集成 URL 与 Zabbix 用户名属**已登记的读地板**（TODO.md:59）；
        本契约只如实描述现状，不改变响应内容。
      operationId: getIntegrationStatus
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationStatus'

  /integrations/sync:
    post:
      tags: [集成管理]
      summary: 触发一次同步
      description: |
        同步方向：NetBox 设备 / Zabbix 告警 / GLPI 工单 / Zabbix 指标。
        `type` 缺省、为空串、或 body 不是合法 JSON → 按 `all` 处理；
        **非空但取值不在词表内 → 400**（原先静默走 all，BUG#7 已收紧）。
        部分数据源失败时返回 **500**，但 `data.synced` 仍带已成功项的计数（失败项无键）。
      operationId: syncIntegrations
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '200':
          description: 同步完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '400':
          description: type 取值不在词表内
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 至少一个数据源同步失败（data.synced 仍含成功项）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'

  /integrations/zabbix:
    put:
      tags: [集成管理]
      summary: 更新 Zabbix 配置（运行时生效）
      description: |
        仅更新**内存配置**并热重载客户端，**不落盘** —— 重启后回到 yaml / env 值。
        `password` 留空 = 保留旧值（避免 UI 清空密码时把后端改成空）；`url` / `user` 必填。
        该路由挂 `RejectAPIKeyAuth`：API Key 身份一律 403（堵住用长期凭据改写集成出站地址）。
      operationId: updateZabbix
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZabbixConfigInput'
      responses:
        '200':
          description: 已生效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationUpdateResult'
        '400':
          description: url / user 缺失
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /integrations/zabbix/test:
    post:
      tags: [集成管理]
      summary: 测试 Zabbix 连通性
      description: |
        仅 Login 一次以验证 URL / 账号密码；**不入 DB、不写指标**。
        失败返回 400，错误文本经 `redact.Text` 脱敏。
      operationId: testZabbix
      responses:
        '200': { description: 连通 OK }
        '400': { description: 连通失败（错误文本已脱敏） }

  /integrations/netbox:
    put:
      tags: [集成管理]
      summary: 更新 NetBox 配置（运行时生效）
      description: |
        同 Zabbix：仅内存生效 + 热重载，不落盘；`token` 留空 = 保留旧值；`url` 必填。
        挂 `RejectAPIKeyAuth`。
      operationId: updateNetBox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetBoxConfigInput'
      responses:
        '200':
          description: 已生效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationUpdateResult'
        '400':
          description: url 缺失
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /integrations/netbox/test:
    post:
      tags: [集成管理]
      summary: 测试 NetBox 连通性
      description: 拉 1 条设备验证 URL / Token；不入 DB。失败返回 400（错误文本已脱敏）。
      operationId: testNetBox
      responses:
        '200': { description: 连通 OK }
        '400': { description: 连通失败（错误文本已脱敏） }

  /integrations/glpi:
    put:
      tags: [集成管理]
      summary: 更新 GLPI 配置（运行时生效）
      description: |
        同 Zabbix：仅内存生效 + 热重载，不落盘；两个 token 各自留空 = 保留旧值；`url` 必填。
        挂 `RejectAPIKeyAuth`。
      operationId: updateGLPI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GLPIConfigInput'
      responses:
        '200':
          description: 已生效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationUpdateResult'
        '400':
          description: url 缺失
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /integrations/glpi/test:
    post:
      tags: [集成管理]
      summary: 测试 GLPI 连通性
      description: InitSession 验证 URL + 两个 token；不入 DB。失败返回 400（错误文本已脱敏）。
      operationId: testGLPI
      responses:
        '200': { description: 连通 OK }
        '400': { description: 连通失败（错误文本已脱敏） }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
