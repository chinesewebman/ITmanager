openapi: 3.0.3
info:
  title: 网络运维监控平台 API
  description: |
    网络运维监控平台后端API规范，基于RESTful设计风格。

    ## 认证方式
    - 所有API需要通过Header传递API Key：`Authorization: Bearer <token>`
    - 登录接口返回token

    ## 响应格式
    所有接口统一响应格式：
    ```json
    {
      "code": 0,
      "message": "success",
      "data": {}
    }
    ```
  version: 1.0.0
  contact:
    name: IT Manager Team

servers:
  - url: http://localhost:8080/api
    description: 本地开发环境
  - url: http://localhost/api
    description: 生产环境

# 顶层默认：**所有** operation 都需要 Bearer 认证（AuthMiddleware）。
# 未认证即可访问的只有三条，各自在 operation 上显式写 `security: []` ——
# GET /health、POST /auth/login、POST /auth/logout（实测方式：对全部 /api 路由发无凭据请求，
# 非 401 的恰为这三条）。新增公开端点必须同步加 `security: []`，否则 spec 与实际不符。
security:
  - BearerAuth: []

tags:
  - name: 认证
    description: 登录、登出相关接口
  - name: 仪表盘
    description: 统计和趋势数据
  - name: 资产管理
    description: 资产CRUD操作
  - name: 告警中心
    description: 告警列表、确认、解决
  - name: 机房机柜
    description: 机房、机柜管理
  - name: 工单管理
    description: 工单相关接口
  - name: 用户管理
    description: 用户列表、详情
  - name: 通知设置
    description: 通知渠道管理
  - name: 系统
    description: 存活探针
  - name: 集成管理
    description: NetBox / Zabbix / GLPI 配置与同步
  - name: API 密钥
    description: 长期凭据的签发 / 查看 / 吊销（限 admin，且拒绝 API Key 身份自我复制）
  - name: 审计日志
    description: 操作留痕查询（限 admin / ops_admin / auditor）

paths:
  # ==================== 认证 ====================
  /auth/login:
    post:
      tags:
        - 认证
      summary: 用户登录
      operationId: login
      security: [] # 公开：登录本身没有凭据可带。反爆破靠 RateLimit（5 req/min per IP）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  description: 用户名
                password:
                  type: string
                  description: 密码
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /auth/logout:
    post:
      tags:
        - 认证
      summary: 用户登出
      operationId: logout
      description: |
        公开端点（未挂 AuthMiddleware）—— 服务端无会话可清，token 由客户端自行丢弃，
        故无凭据也能调、恒 200。此前这里误标 `BearerAuth`，与实现不符，已改。
      security: []
      responses:
        '200':
          description: 登出成功

  /auth/skip-password-change:
    post:
      tags:
        - 认证
      summary: 确认无强制改密待办 (幂等)
      description: |
        C7: 用户在 `/change-password` 页点"跳过"时调用。

        判据是服务端的 `users.must_change_password`，**不看请求体的 reason**（客户端可伪造）：
        - `must_change_password=true` → 400（主人 7/02 决策：首次登录 / 管理员重置后的强制改密不可跳）
        - `must_change_password=false` → 200，幂等且**不写任何状态**（不再写 password_set_at）

        修复前只拒绝 `reason=="first_login"` 字面量，空 body 或 `reason=optional` 即可清 flag
        绕过强改密（见 docs/FIX-PLAN-AUTHZ-LEFTOVER.md S-1）。
      operationId: skipPasswordChange
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  deprecated: true
                  description: 已废弃：服务端不再读取，保留仅为兼容既有客户端请求体
                  example: optional
      responses:
        '200':
          description: 当前无强制改密待办
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: 当前无需改密
        '400':
          description: 当前账号处于强制改密状态, 不允许跳过

  # ==================== 仪表盘 ====================
  /dashboard/stats:
    get:
      tags:
        - 仪表盘
      summary: 获取仪表盘统计
      operationId: getDashboardStats
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'

  /dashboard/trends:
    get:
      tags:
        - 仪表盘
      summary: 获取告警趋势
      operationId: getDashboardTrends
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardTrends'

  /dashboard/kpis:
    get:
      tags:
        - 仪表盘
      summary: 获取关键 KPI 指标
      description: |
        返回 MTTR (平均恢复时间)、MTTD (平均检测时间)、告警密度、SLA 达成率。
        days 默认 7，范围 1-90。
      operationId: getKPIs
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 7
            minimum: 1
            maximum: 90
          description: 窗口天数，默认 7，范围 1-90
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPI'
        '400':
          description: 请求参数错误

  # ==================== 资产管理 ====================
  /assets:
    get:
      tags:
        - 资产管理
      summary: 获取资产列表
      operationId: listAssets
      parameters:
        - name: site_id
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
        - name: keyword
          in: query
          description: 按名称/资产标签/序列号模糊匹配（name/asset_tag/sn）
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetList'

    post:
      tags:
        - 资产管理
      summary: 创建资产
      operationId: createAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'

  /assets/{id}:
    get:
      tags:
        - 资产管理
      summary: 获取资产详情
      operationId: getAsset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'

    put:
      tags:
        - 资产管理
      summary: 更新资产
      operationId: updateAsset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetInput'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'

    delete:
      tags:
        - 资产管理
      summary: 删除资产
      operationId: deleteAsset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 删除成功

  # ==================== 告警中心 ====================
  /alerts:
    get:
      tags:
        - 告警中心
      summary: 获取告警列表
      operationId: listAlerts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [problem, acknowledged, resolved]
        - name: severity
          in: query
          schema:
            type: integer
        - name: host_id
          in: query
          schema:
            type: string
        # limit/cursor 是 handler 一直支持但 spec 漏记的参数（G-37 同类）。
        # 前端仪表盘「最近告警」用 limit=5 取最新几条，类型需与实现对齐。
        - name: limit
          in: query
          description: 返回条数上限，默认 100，上限 1000
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: cursor
          in: query
          description: v2.0 游标分页，取上一页响应的 next_cursor；解码失败时降级为忽略
          schema:
            type: string
        - name: page
          in: query
          description: 页码（>0 走 offset 分页；不传走 limit 上限语义，向后兼容）
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          description: 每页条数，默认 20，上限 500
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertList'

  /alerts/{id}:
    get:
      tags:
        - 告警中心
      summary: 获取告警详情
      operationId: getAlert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '400':
          description: ID 格式错误（必须是 UUID）
        '404':
          description: 告警不存在

  /alerts/{id}/ack:
    put:
      tags:
        - 告警中心
      summary: 确认告警
      operationId: acknowledgeAlert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 确认成功
        '400':
          description: ID 格式错误（必须是 UUID）
        '404':
          description: 告警不存在
        '409':
          description: 告警当前状态不允许确认（如已解决的告警）

  /alerts/{id}/resolve:
    put:
      tags:
        - 告警中心
      summary: 解决告警
      operationId: resolveAlert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 解决成功
        '400':
          description: ID 格式错误（必须是 UUID）
        '404':
          description: 告警不存在
        '409':
          description: 告警当前状态不允许解决

  /alerts/{id}/mark-fp:
    post:
      tags:
        - 告警中心
      summary: 标记/反标记告警为误报
      operationId: markFalsePositive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_false_positive]
              properties:
                is_false_positive:
                  type: boolean
                  description: true=标记为误报，false=反标记
                note:
                  type: string
                  description: 误报备注（如"周期性抖动"）
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '400':
          description: ID 格式错误（必须是 UUID）
        '404':
          description: 告警不存在

  /alerts/{id}/ticket:
    post:
      tags:
        - 告警中心
      summary: 从告警一键建单
      description: |
        由人点「建单」触发，把告警现场信息派生成一张 incident 工单，并回写
        `alerts.ticket_id`（ADR-0004：工单 SoT 在后端，建单必须由人显式发起）。
        **幂等**：同一告警重复调用不会建出第二张票，返回既有那张。

        响应码区分首次与重复：`201` = 本次新建，`200` = 该告警已有关联工单，
        前端据此决定是否提示「已建单」。
      operationId: createTicketFromAlert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: 本次新建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertTicketResult'
        '200':
          description: 告警已有关联工单，幂等返回既有那张（created=false）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertTicketResult'
        '404':
          description: 告警不存在，或其关联的工单已失效

  /alerts/false-positives/export:
    get:
      tags:
        - 告警中心
      summary: 导出误报训练集 CSV
      operationId: exportFalsePositives
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: 可选 RFC3339 时间，增量导出 marked_at >= since 的记录
      responses:
        '200':
          description: CSV 文件流
          content:
            text/csv:
              schema:
                type: string

  /alerts/stats:
    get:
      tags:
        - 告警中心
      summary: 获取告警统计
      operationId: getAlertStats
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertStats'

  # ==================== 告警规则 ====================
  /alert-rules:
    get:
      tags:
        - 告警中心
      summary: 获取告警规则列表
      operationId: listAlertRules
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRuleList'

    post:
      tags:
        - 告警中心
      summary: 创建告警规则
      operationId: createAlertRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleInput'
      responses:
        '201':
          description: 创建成功

  /alert-rules/{id}:
    put:
      tags:
        - 告警中心
      summary: 更新告警规则
      operationId: updateAlertRule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleInput'
      responses:
        '200':
          description: 更新成功

    delete:
      tags:
        - 告警中心
      summary: 删除告警规则
      operationId: deleteAlertRule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 删除成功

  # ==================== 机房 ====================
  /sites:
    get:
      tags:
        - 机房机柜
      summary: 获取机房列表
      operationId: listSites
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteList'

  /sites/{id}:
    get:
      tags:
        - 机房机柜
      summary: 获取机房详情
      operationId: getSite
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteDetail'

  # ==================== 机柜 ====================
  /racks:
    get:
      tags:
        - 机房机柜
      summary: 获取机柜列表
      operationId: listRacks
      parameters:
        - name: site_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RackList'

  /racks/{id}:
    get:
      tags:
        - 机房机柜
      summary: 获取机柜详情
      operationId: getRack
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rack'

  /racks/{id}/devices:
    get:
      tags:
        - 机房机柜
      summary: 获取机柜内设备
      operationId: getRackDevices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RackDeviceList'

  # ==================== 工单 ====================
  /tickets:
    get:
      tags:
        - 工单管理
      summary: 获取工单列表
      operationId: listTickets
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketList'

    post:
      tags:
        - 工单管理
      summary: 创建工单
      operationId: createTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketInput'
      responses:
        '201':
          description: 创建成功

  /tickets/{id}:
    get:
      tags:
        - 工单管理
      summary: 获取工单详情
      operationId: getTicket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'

    put:
      tags:
        - 工单管理
      summary: 更新工单
      operationId: updateTicket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketInput'
      responses:
        '200':
          description: 更新成功

  # M25 经手历史。准入与 GET /tickets/{id} 同级（「跟工单本身的可见性」，用户 2026-09-11 拍板③）——
  # 这与 GET /audit-logs 收在 canAudit 的先例相反，是有意放宽，见 docs/FIX-PLAN-TICKET-HISTORY.md §2.6。
  /tickets/{id}/history:
    get:
      tags:
        - 工单管理
      summary: 获取工单经手历史
      operationId: listTicketHistory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          description: 每页条数，默认 20，上限 500（超出由 service 层夹住）
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketHistoryList'
        '404':
          description: 工单不存在（不返回空列表 —— 那会被读成「这张票还没被改过」）

  # ==================== 用户 ====================
  /users:
    get:
      tags:
        - 用户管理
      summary: 获取用户列表
      operationId: listUsers
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'

  /users/{id}:
    get:
      tags:
        - 用户管理
      summary: 获取用户详情
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  # ==================== 通知渠道 ====================
  /notification-channels:
    get:
      tags:
        - 通知设置
      summary: 获取通知渠道列表
      operationId: listChannels
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelList'

    post:
      tags:
        - 通知设置
