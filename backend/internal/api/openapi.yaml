      description: |
        聚合 alerts / tickets / assets / asset_networks 四张表，按时间倒序返回事件流。
        含 MTTR (平均恢复时间)、open_alerts、open_tickets 等摘要。
      operationId: getAssetTimeline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 30
            maximum: 365
          description: 查询窗口（天）默认 30，最大 365
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
            maximum: 1000
          description: 事件数上限，默认 200，最大 1000
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticTimeline'
        '400':
          description: 请求参数错误
        '404':
          description: 资产不存在

  /diagnostics/ping:
    get:
      tags:
