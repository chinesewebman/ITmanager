    # ==================== 工单 ====================
    Ticket:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [critical, high, normal, low]
        status:
          type: string
          enum: [open, in_progress, pending, resolved, closed]
        requester:
          type: string
        assignee:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TicketInput:
      type: object
      required:
        - title
        - priority
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          type: string

    TicketList:
      type: object
      properties:
        code:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'

    # M25 经手历史。一行 = 一次请求里一个字段的一次变更（append-only，只增不改）。
    #
    # 注意与上面 TicketList 的对比：这里的 data 是**如实**的 {items,total,page,size}
    # —— TicketList.data 声明成裸数组是既有漂移（已另行登记），不在此步顺手改。
    #
    # 所有字段都**没有 omitempty**：可空列在 JSON 里是真 null，不是「缺键」。
    # 前端要靠这个区分「字段没被改过」（键在，值是 null）与「响应里没这段」。
    #
    # 因此这里**如实声明 required**（本文件其余响应 schema 多不声明，属既有宽松写法）：
    # 不声明的话生成物会把每个字段都标成可选，消费者被迫写一堆 ?. 和 ?? —— 而那是假的，
    # 键一定在。声明了 required 才能用 types/index.ts 的 _Equal 断言把漂移变成 tsc 报错
    # （同 P1-4 对 User 的做法）。
    TicketHistory:
      type: object
      required:
        - id
        - ticket_id
        - batch_id
        - kind
        - field_name
        - old_value
        - new_value
        - actor_id
        - actor_name
        - source
        - request_id
        - created_at
      properties:
        id:
          type: string
        ticket_id:
          type: string
        batch_id:
          type: string
          description: 同一次 PUT 产生的多行共享同一个值；前端按它分组，避免同秒两次操作并成一组
        kind:
          type: string
          enum: [created, updated]
          description: created 的出生行 field_name 为 null（那一次改的不是某字段，而是「这张票存在了」）
        field_name:
          type: string
          nullable: true
        old_value:
          type: string
          nullable: true
          description: 文本快照（时间戳按 RFC3339）。超 500 字符按 rune 截断并追加「…(截断)」
        new_value:
          type: string
          nullable: true
        actor_id:
          type: string
          nullable: true
          description: 裸 UUID、无外键（同 audit_logs.resource_id）；写入时的操作者
        actor_name:
          type: string
          description: 写入时点的姓名快照 —— 用户改名后旧记录仍显示当时的名字
        source:
          type: string
          description: 开放值（manual/email/api/glpi/alert/zabbix）。当前恒为空串，取值待定（D-6）
        request_id:
          type: string
          description: 预留，当前恒为空串（D-6）
        created_at:
          type: string
          format: date-time

    TicketHistoryList:
      type: object
      properties:
        code:
          type: integer
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/TicketHistory'
            total:
              type: integer
            page:
              type: integer
            size:
              type: integer

    # ==================== 用户 ====================
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        nickname:
          type: string
        email:
          type: string
        role:
          type: string
          # 权威词表 = migrations/000001 的 roles.code + 000013 兜底值 user。
          # 旧值 operator/viewer 仅在存量库里可能见到，服务端会折叠为 ops_user/readonly。
          enum: [admin, ops_admin, ops_user, auditor, readonly, user]
        created_at:
          type: string
          format: date-time

    UserList:
      type: object
      properties:
        code:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'

    # ==================== 通知渠道 ====================
    NotificationChannel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [email, dingtalk, wechat, webhook]
          description: 响应模型
        config:
          type: string
          description: JSON 字符串，键名见 internal/notification/channelConfig 的 json tag
        is_enabled:
          type: boolean

    ChannelInput:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          type: string
          enum: [email, dingtalk, wechat, webhook]
          description: wechat = 企业微信群机器人（config 只需 url，回执 errcode 判失败）
        config:
          type: string
          description: JSON 字符串，键名见 internal/notification/channelConfig 的 json tag
        is_enabled:
          type: boolean
          description: 省略时后端按 true 处理（新建）

    ChannelList:
      type: object
      properties:
        code:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/NotificationChannel'

    Runbook:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        asset_type: { type: string }
        summary: { type: string }
        content_md: { type: string }
        steps: { type: string, description: "JSON 步骤数组" }
        tags: { type: string }
        severity: { type: integer, description: "0=不限制; 1-5=对应告警严重度" }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MetricSnapshot:
      type: object
      properties:
        id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        key: { type: string }
        value: { type: number, format: double }
        ts: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    # ==================== 系统探针 ====================
    Health:
      type: object
      description: 存活探针响应。不依赖 DB / 外部服务，故恒 200。
      properties:
        status: { type: string, enum: [alive], example: alive }

    # ==================== 集成管理（v2.2）====================
    SyncRequest:
      type: object
      properties:
        type:
          type: string
          enum: [netbox, zabbix, glpi, zabbix_metrics, all]
          default: all
          description: 缺省 / 空串 / body 非法 JSON → 按 all 处理；非空但不在词表内 → 400

    SyncResult:
      type: object
      description: |
        同步结果信封。`data.synced` 的键**随 type 而变**（自由形态，未在契约里收口 ——
        见 TODO **G-41**）：netbox / zabbix / glpi / zabbix_metrics 为同步条数；
        `zabbix_truncated` 是 0/1 **标志**（不是条数）；`glpi_skipped` 是档位越界被跳过的条数。
        失败的数据源**连键都没有**（前端以 `?? 0` 兜底）。
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          type: object
          properties:
            synced:
              type: object
              additionalProperties: { type: integer }
              description: 键随 type 而变，见上；取值均为整数（含 0/1 标志位）。

    IntegrationStatus:
      type: object
      description: |
        集成配置状态。`enabled` = 该项 URL 非空。
        ⚠️ `has_*` 布尔位**仅 canManage（admin / ops_admin）返回** —— 它们泄露「凭据是否已配置」。
        回传 url / user 属已登记的读地板（TODO.md:59），本契约只描述现状。
      properties:
        code: { type: integer }
        data:
          type: object
          properties:
            netbox:
              type: object
              required: [enabled, url]
              properties:
                enabled: { type: boolean }
                url: { type: string, description: 未配置时为空串 }
                has_token: { type: boolean, description: 仅 canManage 返回 }
            zabbix:
              type: object
              required: [enabled, url, user]
              properties:
                enabled: { type: boolean }
                url: { type: string, description: 未配置时为空串 }
                user: { type: string, description: 对所有已认证角色可见 }
                has_password: { type: boolean, description: 仅 canManage 返回 }
            glpi:
              type: object
              required: [enabled, url]
              properties:
                enabled: { type: boolean }
                url: { type: string, description: 未配置时为空串 }
                has_app_token: { type: boolean, description: 仅 canManage 返回 }
                has_user_token: { type: boolean, description: 仅 canManage 返回 }

    IntegrationUpdateResult:
      type: object
      description: 配置已生效（**仅内存**）。message 会说明「重启后回到 yaml / env 值」。
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          type: object
          properties:
            url: { type: string, description: 生效后的集成基址（回显，非凭据） }
            user: { type: string, description: 仅 Zabbix 返回 }

    ZabbixConfigInput:
      type: object
      required: [url, user]
      properties:
        url: { type: string, format: uri }
        user: { type: string }
        password:
          type: string
          description: 留空 = 保留旧值。仅存内存、不落盘，且**不在任何响应里回显**。

    NetBoxConfigInput:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        token:
          type: string
          description: 留空 = 保留旧值。仅存内存、不落盘，且**不在任何响应里回显**。

    GLPIConfigInput:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        app_token:
          type: string
          description: 留空 = 保留旧值。仅存内存、不落盘，且**不在任何响应里回显**。
        user_token:
          type: string
          description: 留空 = 保留旧值。仅存内存、不落盘，且**不在任何响应里回显**。

    # ==================== 当前身份与改密 ====================
    CurrentUser:
      type: object
      description: |
        当前登录用户。`role` / `capabilities` 取自**鉴权上下文**（JWT claim / API Key 关联用户），
        与门禁实际使用的值同源。与 `User`（用户管理列表里的一行）**不是同一个形态** ——
        这里没有 `created_at`，多了 `capabilities` / `phone` / `avatar` / `status`。
      properties:
        code: { type: integer }
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
            nickname: { type: string }
            email: { type: string }
            phone: { type: string }
            avatar: { type: string }
            role:
              type: string
              description: 规范化后的角色（存量 operator / viewer 由服务端折叠为 ops_user / readonly）
              enum: [admin, ops_admin, ops_user, auditor, readonly, user]
            capabilities:
              type: array
              description: |
                该角色具备的能力集，顺序固定（read 在前）。前端据此隐藏入口；
                服务端仍独立判权，**不得**把这里当访问控制依据。
              items:
                type: string
                enum: [read, write, manage, audit, identity]
            status: { type: string, enum: [active, inactive] }

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password: { type: string }
        new_password:
          type: string
          description: |
            ≥8 字符，且**同时包含字母与数字**；不得与旧密码相同。
            任一条不满足 → 400（与「旧密码错误」同为 400，响应文案区分）。

    # ==================== API 密钥 ====================
    APIKey:
      type: object
      description: 列表里的一条 Key。**含 `key_hash` 的字段在本形态中不存在** —— 模型层标 `json:"-"`，永不下发。
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix:
          type: string
          description: 完整 Key 的前 8 字符，仅供 UI 识别
        permissions:
          type: array
          items: { type: string }
        ip_whitelist:
          type: array
          description: 裸 IP 或 CIDR；**鉴权侧按网段匹配**（裸 IP 等价 /32、/128）
          items: { type: string }
        rate_limit: { type: integer }
        status: { type: string, enum: [active, revoked] }
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: 无过期时间为 null
        last_used_at:
          type: string
          format: date-time
          nullable: true
        created_at: { type: string, format: date-time }

    APIKeyInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        permissions:
          type: array
          items: { type: string }
          description: 缺省 `["read"]`
        ip_whitelist:
          type: array
          items: { type: string }
          description: 缺省空数组（= 不做 IP 检查，放行）
        rate_limit:
          type: integer
          minimum: 1
          maximum: 100000
          description: 缺省 1000；**显式传 0 视为未提供**（用默认值），不报错
        expires_at:
          type: string
          description: 格式 `YYYY-MM-DD`（**不是** RFC3339）；省略或空串 = 不过期

    APIKeyCreated:
      type: object
      description: ⚠️ `data.api_key` 是**完整明文 Key，仅此一次返回**，之后任何接口都取不回。
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            api_key: { type: string, description: 明文长期凭据，仅此一次 }
            prefix: { type: string }
            permissions:
              type: array
              items: { type: string }
            rate_limit: { type: integer }
            expires_at:
              type: string
              format: date-time
              nullable: true
            created_at: { type: string, format: date-time }

    APIKeyList:
      type: object
      properties:
        code: { type: integer }
        data:
          type: array
          items: { $ref: '#/components/schemas/APIKey' }

    # ==================== 审计日志 ====================
    AuditLog:
      type: object
      description: 一行操作留痕。不含请求体 —— 只记方法 / 路径 / 状态码 / 不可信文本的错误摘要。
      properties:
        id: { type: string, format: uuid }
        user_id:
          type: string
          format: uuid
          nullable: true
          description: 未认证请求（如登录失败）为 null
        username: { type: string }
        action: { type: string }
        resource: { type: string }
        resource_id:
          type: string
          format: uuid
          nullable: true
        method: { type: string }
        path:
          type: string
          description: 请求路径（已剥控制字符，防日志行伪造）
        ip: { type: string, description: 取自 ClientIP()，受 server.trusted_proxies 约束 }
        user_agent: { type: string }
        status: { type: integer, description: HTTP 状态码 }
        error_msg: { type: string }
        request_id: { type: string }
        created_at: { type: string, format: date-time }

    AuditLogList:
      type: object
      description: cursor 分页信封。**没有 `next_cursor` 即到底**（不是「本页不满」）。
      properties:
        code: { type: integer }
        data:
          type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AuditLog' }
            next_cursor:
              type: string
              description: 仅在取满 `limit` 条时出现；下一页原样回传

    # ==================== 告警批量操作 ====================
    BulkRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: string, format: uuid }
          description: 非空，**最多 1000 条**（超出 400）

    BulkResult:
      type: object
      description: '`affected` 是**实际更新行数**，可能小于传入条数（id 不存在 / 状态已终态）。'
      properties:
        code: { type: integer }
        data:
          type: object
          properties:
            affected: { type: integer }

    # ==================== 资产网络接口 ====================
    AssetNetwork:
      type: object
      description: |
        `asset_networks` 一行。退役时 `ipv4_address` / `ipv6_address` 被**清空**
        （值移到 `Asset.last_known_ip4/ip6`），恢复时写回。
      properties:
        id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        interface_name: { type: string }
        interface_type: { type: string, enum: [ethernet, fiber] }
        mac_address: { type: string }
        ipv4_address: { type: string, description: 退役后为空串 }
        ipv4_netmask: { type: string }
        ipv6_address: { type: string, description: 字段名的历史拼写是 `ipv_address`；退役后为空串 }
        speed: { type: integer, description: Mbps }
        duplex: { type: string, enum: [full, half] }
        status: { type: string, enum: [up, down, unknown] }
        connected_to: { type: string }
        connected_port: { type: string }
        purpose: { type: string, enum: [mgmt, service] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AssetRetireResult:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          type: object
          properties:
            asset: { $ref: '#/components/schemas/Asset' }
            networks:
              type: array
              description: 退役后的网卡行（IP 已被清空）
              items: { $ref: '#/components/schemas/AssetNetwork' }
            released_ip4: { type: string, nullable: true, description: 原网卡的 IPv4（已释放，可被新设备使用） }
            released_ip6: { type: string, nullable: true }
            retired_at: { type: string, format: date-time, nullable: true }
            retired_reason: { type: string, nullable: true }

    AssetRestoreResult:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          type: object
          properties:
            asset: { $ref: '#/components/schemas/Asset' }
            networks:
              type: array
              description: 恢复后的网卡行（IP 已写回）
              items: { $ref: '#/components/schemas/AssetNetwork' }
