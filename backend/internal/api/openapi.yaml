      description: |
        调用系统 ping 工具探测资产 IP 的可达性。
        count 默认 4，上限 20。响应包含 transmitted/received/loss/min/avg/max ms。
      operationId: pingAsset
      parameters:
        - name: host
          in: query
          required: true
          schema:
            type: string
          description: 目标 host（IP 或 hostname）
        - name: count
          in: query
          required: false
          schema:
            type: integer
            default: 4
            maximum: 20
          description: ping 次数，默认 4，上限 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResult'
        '400':
          description: 请求参数错误
        '500':
          description: ping 执行失败

  /diagnostics/traceroute:
    get:
      tags:
        - 资产诊断
      summary: 资产 traceroute 网络路径
      description: |
        调用系统 traceroute 跟踪资产 IP 的网络路径。
        maxHops 默认 30，上限 64。
      operationId: tracerouteAsset
      parameters:
