        - name: enabled
          in: query
          schema: { type: boolean }
        - name: keyword
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Runbook' }
                  total: { type: integer }
    post:
      tags: [Runbook]
      summary: 创建 Runbook
      operationId: createRunbook
      requestBody:
        required: true
