        severity:
          type: integer
          minimum: 1
          maximum: 5
        severity_name:
          type: string
        status:
          type: string
          enum: [problem, acknowledged, resolved]
        asset_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        ack_time:
          type: string
          format: date-time
        ack_user:
          type: string
        resolve_time:
          type: string
          format: date-time
        resolve_user:
          type: string
        duration:
          type: integer
        is_false_positive:
          type: boolean
          description: 是否被标记为误报（小改进 #2）
        marked_by:
          type: string
          description: 标记人 username
        marked_at:
          type: string
          format: date-time
        false_positive_note:
          type: string
          description: 误报标记备注

    AlertList:
      type: object
      properties:
        code:
          type: integer
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Alert'
            stats:
              type: object
              properties:
                total:
                  type: integer
                problem:
                  type: integer
                acknowledged:
                  type: integer
                resolved:
                  type: integer
            total:
              type: integer
              description: 过滤后总数（分页器「共 X 条」），区别于 stats.total 全表总数
            next_cursor:
              type: string
              description: 还有下一页时返回（items 长度等于 limit 时）

    # D-3 告警一键建单的响应体。created 是前端区分 201/200 之外的显式标志：
    # 一次「看似新建」的点击在并发下可能被别人抢先，此时返回的是既有票。
    AlertTicketResult:
      type: object
      properties:
        code:
          type: integer
        data:
          type: object
          properties:
            ticket:
              $ref: '#/components/schemas/Ticket'
            created:
              type: boolean
              description: true=本次新建；false=该告警已有关联工单，ticket 为既有那张

    AlertStats:
      type: object
      properties:
        code:
          type: integer
        data:
          type: object
          properties:
            by_severity:
              type: array
              items:
                type: object
                properties:
                  severity:
                    type: integer
                  severity_name:
                    type: string
                  count:
                    type: integer
            by_hour:
              type: array
              items:
                type: object
                properties:
                  hour:
                    type: string
                    format: date-time
                  count:
                    type: integer

    AlertRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        condition:
          type: string
        threshold:
          type: number
        severity:
          type: integer
        is_enabled:
          type: boolean
        notification_channels:
          type: array
          items:
            type: string

    AlertRuleInput:
      type: object
      required:
        - name
        - condition
        - threshold
        - severity
      properties:
        name:
          type: string
        condition:
          type: string
        threshold:
          type: number
        severity:
          type: integer
        is_enabled:
          type: boolean

    AlertRuleList:
      type: object
      properties:
        code:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/AlertRule'

    # ==================== 机房机柜 ====================
    Site:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        location:
          type: string
        is_active:
          type: boolean

    SiteList:
      type: object
      properties:
        code:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/Site'

    SiteDetail:
      type: object
      properties:
        code:
          type: integer
        data:
          type: object
          properties:
            site:
              $ref: '#/components/schemas/Site'
            rack_count:
              type: integer
            asset_count:
              type: integer

    Rack:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        site_id:
          type: string
          format: uuid
        total_units:
          type: integer
        used_units:
          type: integer

    RackList:
      type: object
      properties:
        code:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/Rack'

    RackDevice:
      allOf:
        - $ref: '#/components/schemas/Asset'
        - type: object
          properties:
            status:
              type: string
              enum: [green, yellow, red]
            alert_count:
              type: integer

    RackDeviceList:
      type: object
      properties:
        code:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/RackDevice'

    # ==================== 工单 ====================
    Ticket:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [critical, high, normal, low]
        status:
          type: string
          enum: [open, in_progress, pending, resolved, closed]
        requester:
          type: string
        assignee:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TicketInput:
      type: object
      required:
        - title
        - priority
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          type: string

    TicketList:
      type: object
      properties:
        code:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'

    # M25 经手历史。一行 = 一次请求里一个字段的一次变更（append-only，只增不改）。
    #
    # 注意与上面 TicketList 的对比：这里的 data 是**如实**的 {items,total,page,size}
    # —— TicketList.data 声明成裸数组是既有漂移（已另行登记），不在此步顺手改。
    #
    # 所有字段都**没有 omitempty**：可空列在 JSON 里是真 null，不是「缺键」。
    # 前端要靠这个区分「字段没被改过」（键在，值是 null）与「响应里没这段」。
    #
    # 因此这里**如实声明 required**（本文件其余响应 schema 多不声明，属既有宽松写法）：
    # 不声明的话生成物会把每个字段都标成可选，消费者被迫写一堆 ?. 和 ?? —— 而那是假的，
    # 键一定在。声明了 required 才能用 types/index.ts 的 _Equal 断言把漂移变成 tsc 报错
    # （同 P1-4 对 User 的做法）。
    TicketHistory:
      type: object
      required:
        - id
        - ticket_id
        - batch_id
        - kind
        - field_name
        - old_value
        - new_value
        - actor_id
        - actor_name
        - source
        - request_id
        - created_at
      properties:
        id:
          type: string
        ticket_id:
          type: string
        batch_id:
          type: string
          description: 同一次 PUT 产生的多行共享同一个值；前端按它分组，避免同秒两次操作并成一组
        kind:
          type: string
          enum: [created, updated]
          description: created 的出生行 field_name 为 null（那一次改的不是某字段，而是「这张票存在了」）
        field_name:
          type: string
          nullable: true
        old_value:
          type: string
          nullable: true
          description: 文本快照（时间戳按 RFC3339）。超 500 字符按 rune 截断并追加「…(截断)」
        new_value:
          type: string
          nullable: true
        actor_id:
          type: string
          nullable: true
          description: 裸 UUID、无外键（同 audit_logs.resource_id）；写入时的操作者
        actor_name:
          type: string
          description: 写入时点的姓名快照 —— 用户改名后旧记录仍显示当时的名字
        source:
          type: string
          description: 开放值（manual/email/api/glpi/alert/zabbix）。当前恒为空串，取值待定（D-6）
        request_id:
          type: string
          description: 预留，当前恒为空串（D-6）
        created_at:
          type: string
          format: date-time

    TicketHistoryList:
      type: object
      properties:
        code:
          type: integer
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/TicketHistory'
            total:
              type: integer
            page:
              type: integer
            size:
              type: integer

    # ==================== 用户 ====================
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        nickname:
          type: string
        email:
          type: string
        role:
          type: string
          # 权威词表 = migrations/000001 的 roles.code + 000013 兜底值 user。
          # 旧值 operator/viewer 仅在存量库里可能见到，服务端会折叠为 ops_user/readonly。
          enum: [admin, ops_admin, ops_user, auditor, readonly, user]
        created_at:
          type: string
          format: date-time

    UserList:
      type: object
      properties:
        code:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'

    # ==================== 通知渠道 ====================
    NotificationChannel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [email, dingtalk, wechat, webhook]
          description: 响应模型
        config:
          type: string
          description: JSON 字符串，键名见 internal/notification/channelConfig 的 json tag
        is_enabled:
          type: boolean

    ChannelInput:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          type: string
          enum: [email, dingtalk, wechat, webhook]
          description: wechat = 企业微信群机器人（config 只需 url，回执 errcode 判失败）
        config:
          type: string
          description: JSON 字符串，键名见 internal/notification/channelConfig 的 json tag
        is_enabled:
          type: boolean
          description: 省略时后端按 true 处理（新建）

    ChannelList:
      type: object
      properties:
        code:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/NotificationChannel'

    Runbook:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        asset_type: { type: string }
        summary: { type: string }
        content_md: { type: string }
        steps: { type: string, description: "JSON 步骤数组" }
        tags: { type: string }
        severity: { type: integer, description: "0=不限制; 1-5=对应告警严重度" }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MetricSnapshot:
      type: object
      properties:
        id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        key: { type: string }
        value: { type: number, format: double }
        ts: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    # ==================== 系统探针 ====================
    Health:
      type: object
      description: 存活探针响应。不依赖 DB / 外部服务，故恒 200。
      properties:
        status: { type: string, enum: [alive], example: alive }

    # ==================== 集成管理（v2.2）====================
    SyncRequest:
      type: object
      properties:
        type:
          type: string
          enum: [netbox, zabbix, glpi, zabbix_metrics, all]
          default: all
          description: 缺省 / 空串 / body 非法 JSON → 按 all 处理；非空但不在词表内 → 400

    SyncResult:
      type: object
      description: |
        同步结果信封。`data.synced` 的键**随 type 而变**（自由形态，未在契约里收口 ——
        见 TODO **G-41**）：netbox / zabbix / glpi / zabbix_metrics 为同步条数；
        `zabbix_truncated` 是 0/1 **标志**（不是条数）；`glpi_skipped` 是档位越界被跳过的条数。
        失败的数据源**连键都没有**（前端以 `?? 0` 兜底）。
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          type: object
          properties:
            synced:
              type: object
              additionalProperties: { type: integer }
              description: 键随 type 而变，见上；取值均为整数（含 0/1 标志位）。

    IntegrationStatus:
      type: object
      description: |
        集成配置状态。`enabled` = 该项 URL 非空。
        ⚠️ `has_*` 布尔位**仅 canManage（admin / ops_admin）返回** —— 它们泄露「凭据是否已配置」。
        回传 url / user 属已登记的读地板（TODO.md:59），本契约只描述现状。
      properties:
        code: { type: integer }
        data:
          type: object
          properties:
            netbox:
              type: object
              required: [enabled, url]
              properties:
                enabled: { type: boolean }
                url: { type: string, description: 未配置时为空串 }
                has_token: { type: boolean, description: 仅 canManage 返回 }
            zabbix:
              type: object
              required: [enabled, url, user]
              properties:
                enabled: { type: boolean }
                url: { type: string, description: 未配置时为空串 }
                user: { type: string, description: 对所有已认证角色可见 }
                has_password: { type: boolean, description: 仅 canManage 返回 }
            glpi:
              type: object
              required: [enabled, url]
              properties:
                enabled: { type: boolean }
                url: { type: string, description: 未配置时为空串 }
                has_app_token: { type: boolean, description: 仅 canManage 返回 }
                has_user_token: { type: boolean, description: 仅 canManage 返回 }

    IntegrationUpdateResult:
      type: object
      description: 配置已生效（**仅内存**）。message 会说明「重启后回到 yaml / env 值」。
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          type: object
          properties:
            url: { type: string, description: 生效后的集成基址（回显，非凭据） }
            user: { type: string, description: 仅 Zabbix 返回 }

    ZabbixConfigInput:
      type: object
      required: [url, user]
      properties:
        url: { type: string, format: uri }
        user: { type: string }
        password:
          type: string
          description: 留空 = 保留旧值。仅存内存、不落盘，且**不在任何响应里回显**。

    NetBoxConfigInput:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        token:
          type: string
          description: 留空 = 保留旧值。仅存内存、不落盘，且**不在任何响应里回显**。

    GLPIConfigInput:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        app_token:
          type: string
          description: 留空 = 保留旧值。仅存内存、不落盘，且**不在任何响应里回显**。
        user_token:
          type: string
          description: 留空 = 保留旧值。仅存内存、不落盘，且**不在任何响应里回显**。
