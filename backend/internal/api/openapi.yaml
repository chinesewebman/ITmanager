          type: string
        rack_id:
          type: string
          format: uuid
        rack_name:
          type: string
        rack_position:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AssetInput:
      type: object
      required:
