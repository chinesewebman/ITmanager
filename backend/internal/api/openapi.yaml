      summary: 按告警推荐 Runbook
      operationId: recommendRunbooks
      parameters:
        - name: asset_type
          in: query
          schema: { type: string }
        - name: severity
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: 推荐列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Runbook' }
  /runbooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Runbook]
      summary: 获取 Runbook
      operationId: getRunbook
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Runbook' }
        '404': { description: 不存在 }
    put:
      tags: [Runbook]
      summary: 更新 Runbook
      operationId: updateRunbook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Runbook' }
      responses:
        '200': { description: 成功 }
        '400': { description: 参数错误 }
        '404': { description: 不存在 }
    delete:
      tags: [Runbook]
      summary: 删除 Runbook
      operationId: deleteRunbook
      responses:
        '204': { description: 成功 }
        '404': { description: 不存在 }

  # ==================== 指标快照（P2-2）====================
  /metric-snapshots:
    get:
      tags: [指标快照]
      summary: 时序查询
      operationId: queryMetricSnapshots
      parameters:
        - name: asset_id
          in: query
          schema: { type: string, format: uuid }
        - name: key
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, default: 1000 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MetricSnapshot' }
    post:
      tags: [指标快照]
      summary: 批量插入
      operationId: bulkInsertMetricSnapshots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/MetricSnapshot' }
      responses:
        '201': { description: 插入成功 }
        '400': { description: 参数错误 }
  /metric-snapshots/latest:
    get:
      tags: [指标快照]
      summary: 取 asset+key 最新 N 个点
      operationId: latestMetricSnapshots
      parameters:
        - name: asset_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: key
          in: query
          required: true
          schema: { type: string }
        - name: n
          in: query
          schema: { type: integer, default: 60 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MetricSnapshot' }

  # ==================== 系统探针 ====================
  /health:
    get:
      tags: [系统]
      summary: 存活探针（旧路径兼容）
      description: |
        内部转发到 `GET /healthz`：只确认进程能响应 HTTP，**不依赖 DB / 外部服务**，故恒 200。
        K8s livenessProbe 用组外 `/healthz`；本路径供仍引用旧地址的 manifest 兼容。
      operationId: getHealth
      security: [] # 公开：探针不能带凭据（K8s livenessProbe 同款）
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  # ==================== 集成管理（v2.2）====================
  /integrations/status:
    get:
      tags: [集成管理]
      summary: 获取集成配置状态
      description: |
        返回 NetBox / Zabbix / GLPI 的 `enabled` + `url`（Zabbix 另含 `user`）。
        `has_*` 布尔位**仅 canManage 角色**（admin / ops_admin）可见 —— 它们泄露
        「凭据是否已配置」，对 readonly / auditor / user 不返回。
        ⚠️ 回传集成 URL 与 Zabbix 用户名属**已登记的读地板**（TODO.md:59）；
        本契约只如实描述现状，不改变响应内容。
      operationId: getIntegrationStatus
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationStatus'

  /integrations/sync:
    post:
      tags: [集成管理]
      summary: 触发一次同步
      description: |
        同步方向：NetBox 设备 / Zabbix 告警 / GLPI 工单 / Zabbix 指标。
        `type` 缺省、为空串、或 body 不是合法 JSON → 按 `all` 处理；
        **非空但取值不在词表内 → 400**（原先静默走 all，BUG#7 已收紧）。
        部分数据源失败时返回 **500**，但 `data.synced` 仍带已成功项的计数（失败项无键）。
      operationId: syncIntegrations
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '200':
          description: 同步完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '400':
          description: type 取值不在词表内
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 至少一个数据源同步失败（data.synced 仍含成功项）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'

  /integrations/zabbix:
    put:
      tags: [集成管理]
      summary: 更新 Zabbix 配置（运行时生效）
      description: |
        仅更新**内存配置**并热重载客户端，**不落盘** —— 重启后回到 yaml / env 值。
        `password` 留空 = 保留旧值（避免 UI 清空密码时把后端改成空）；`url` / `user` 必填。
        该路由挂 `RejectAPIKeyAuth`：API Key 身份一律 403（堵住用长期凭据改写集成出站地址）。
      operationId: updateZabbix
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZabbixConfigInput'
      responses:
        '200':
          description: 已生效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationUpdateResult'
        '400':
          description: url / user 缺失
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /integrations/zabbix/test:
    post:
      tags: [集成管理]
      summary: 测试 Zabbix 连通性
      description: |
        仅 Login 一次以验证 URL / 账号密码；**不入 DB、不写指标**。
        失败返回 400，错误文本经 `redact.Text` 脱敏。
      operationId: testZabbix
      responses:
        '200': { description: 连通 OK }
        '400': { description: 连通失败（错误文本已脱敏） }

  /integrations/netbox:
    put:
      tags: [集成管理]
      summary: 更新 NetBox 配置（运行时生效）
      description: |
        同 Zabbix：仅内存生效 + 热重载，不落盘；`token` 留空 = 保留旧值；`url` 必填。
        挂 `RejectAPIKeyAuth`。
      operationId: updateNetBox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetBoxConfigInput'
      responses:
        '200':
          description: 已生效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationUpdateResult'
        '400':
          description: url 缺失
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /integrations/netbox/test:
    post:
      tags: [集成管理]
      summary: 测试 NetBox 连通性
      description: 拉 1 条设备验证 URL / Token；不入 DB。失败返回 400（错误文本已脱敏）。
      operationId: testNetBox
      responses:
        '200': { description: 连通 OK }
        '400': { description: 连通失败（错误文本已脱敏） }

  /integrations/glpi:
    put:
      tags: [集成管理]
      summary: 更新 GLPI 配置（运行时生效）
      description: |
        同 Zabbix：仅内存生效 + 热重载，不落盘；两个 token 各自留空 = 保留旧值；`url` 必填。
        挂 `RejectAPIKeyAuth`。
      operationId: updateGLPI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GLPIConfigInput'
      responses:
        '200':
          description: 已生效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationUpdateResult'
        '400':
          description: url 缺失
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /integrations/glpi/test:
    post:
      tags: [集成管理]
      summary: 测试 GLPI 连通性
      description: InitSession 验证 URL + 两个 token；不入 DB。失败返回 400（错误文本已脱敏）。
      operationId: testGLPI
      responses:
        '200': { description: 连通 OK }
        '400': { description: 连通失败（错误文本已脱敏） }

  # ==================== 当前身份与改密 ====================
  /auth/me:
    get:
      tags: [认证]
      summary: 获取当前登录用户
      description: |
        供前端启动时取当前身份与能力集。`role` / `capabilities` 取自**鉴权上下文**
        （JWT claim / API Key 关联用户），与门禁实际使用的值同源，不是回查 DB 的 role ——
        避免「按钮隐藏但接口放行」的错位。
      operationId: getCurrentUser
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: 未认证 / 凭证无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 用户已不存在（凭证有效但账号被删）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/password:
    put:
      tags: [认证]
      summary: 修改当前用户密码
      description: |
        校验旧密码 → 强度校验（**≥8 字符且同时含字母与数字**）→
        **禁止与旧密码相同** → bcrypt 落库，并清除 `must_change_password`。

        该路由有两道额外限制（均非通用）：
        - 挂 `RejectAPIKeyAuth`：API Key 身份一律 403。泄露的 write Key 若同时掌握旧密码
          即可改掉账号密码，而吊销 Key 撤销不了。
        - 限流 **3 req/min per IP**（远严于 protected 组默认的 100）。

        失败一律 400，**不区分**「旧密码错」与「新密码不合规」以外的原因。
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200': { description: 密码修改成功 }
        '400':
          description: 旧密码错误 / 新密码强度不足 / 新旧密码相同
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 当前为 API Key 身份（禁止改密）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== API 密钥（长期凭据）====================
  /auth/api-keys:
    get:
      tags: [API 密钥]
      summary: 列出当前用户的 API Key
      description: |
        只返回**当前用户**的 Key（`user_id` 取自鉴权上下文）。
        哈希列 `key_hash` 在模型层标 `json:"-"`，**永不出现在任何响应里**；
        只回显 `prefix`（前 8 字符）供识别。
      operationId: listAPIKeys
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyList'
        '401':
          description: 凭证无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [API 密钥]
      summary: 创建 API Key
      description: |
        ⚠️ 响应里的 `data.api_key` 是**完整明文 Key，仅此一次返回**，之后任何接口都取不回
        （库里只存 HMAC-SHA256(pepper) 哈希）。

        约束：
        - 整组挂 `RejectAPIKeyAuth` —— 长期凭据**不得自我复制**（write scope 的 Key 挂在
          admin 账号上即可铸造新 Key，吊销旧 Key 后新 Key 仍存活）。
        - `must_change_password=true` 的账号禁止铸造（否则默认口令登录后立刻铸一把不过期的
          Key，即可绕过「首次登录必须改密」，且之后改密也撤不掉）。
        - `permissions` 缺省 `["read"]`；`rate_limit` 缺省 1000，合法区间 `[1, 100000]`；
          `ip_whitelist` 接受裸 IP 或 CIDR，**鉴权侧按网段匹配**（裸 IP 等价 /32、/128）。
        - `expires_at` 格式 `YYYY-MM-DD`（**不是** RFC3339）。
      operationId: createAPIKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyInput'
      responses:
        '201':
          description: 创建成功（含一次性明文 Key）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyCreated'
        '400':
          description: 参数错误（名称缺失 / ip_whitelist 非法 / rate_limit 越界 / expires_at 格式错）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 账号处于强制改密状态 / 当前为 API Key 身份 / 无密钥管理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 同 user 下已存在同名 API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/api-keys/{id}:
    delete:
      tags: [API 密钥]
      summary: 删除 API Key（物理删除）
      description: 只能删自己的 Key（查询条件同时带 `id` 与 `user_id`）。不可恢复；保留审计用「吊销」。
      operationId: deleteAPIKey
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: 删除成功 }
        '404':
          description: API Key 不存在（或不属于当前用户）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/api-keys/{id}/revoke:
    put:
      tags: [API 密钥]
      summary: 吊销 API Key（置 status=revoked，保留记录）
      description: |
        不删行，只把 `status` 置为 `revoked` —— 保留审计追溯。
        与删除同样只能作用于自己的 Key。
      operationId: revokeAPIKey
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: API Key 已吊销 }
        '404':
          description: API Key 不存在（或不属于当前用户）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== 审计日志（v2.0）====================
  /audit-logs:
    get:
      tags: [审计日志]
      summary: 查询审计日志（cursor 分页）
      description: |
        按时间倒序返回操作留痕。**需要 `audit` 能力**（admin / ops_admin / auditor）。

        分页是 **cursor 式**（不是 offset）：`limit` 条恰好取满时响应带 `next_cursor`，
        下一页把它原样回传即可。**没有 `next_cursor` 即到底**（不是「本页不满」）。
        注意 `limit` 是「本页最多几条」，服务端不对它做上限校验 —— 传大值即大页。

        过滤参数为**精确匹配**（`action` / `method` / `path` 都是 `=` 而非模糊）；
        `user_id` 非法 uuid 时**静默忽略该过滤条件**（不是 400）。
      operationId: listAuditLogs
      parameters:
        - name: user_id
          in: query
          schema: { type: string, format: uuid }
          description: 非法 uuid 会被静默忽略（退回不按用户过滤）
        - name: action
          in: query
          schema: { type: string }
        - name: method
          in: query
          schema: { type: string }
        - name: path
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
          description: 上一页返回的 next_cursor；解码失败时静默忽略
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'
        '500':
          description: 查询失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== 告警批量操作（C-P6）====================
  /alerts/bulk-ack:
    post:
      tags: [告警中心]
      summary: 批量确认告警
      description: 单条 SQL 批量更新，不逐条循环。`ids` **最多 1000 条**（超出 400）。
      operationId: bulkAcknowledgeAlerts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkRequest'
      responses:
        '200':
          description: 成功（`affected` 为实际更新行数，可能小于传入条数）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '400':
          description: ids 为空 / 非法 JSON / 超过 1000 条
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /alerts/bulk-resolve:
    post:
      tags: [告警中心]
      summary: 批量解决告警
      description: 同批量确认：单条 SQL、`ids` 上限 1000。
      operationId: bulkResolveAlerts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '400':
          description: ids 为空 / 非法 JSON / 超过 1000 条
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /alerts/bulk-delete:
    post:
      tags: [告警中心]
      summary: 批量删除告警
      description: |
        物理删除、不可恢复。需要 `manage` 能力（admin / ops_admin）—— 比批量确认 / 解决
        （`write`）更严。`ids` 上限 1000。
      operationId: bulkDeleteAlerts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '400':
          description: ids 为空 / 非法 JSON / 超过 1000 条
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== 资产导出与软退役（B4）====================
  /assets/export:
    get:
      tags: [资产管理]
      summary: 导出资产（CSV / JSON）
      description: |
        `format=csv`（默认）→ 返回 `text/csv` 附件，表头固定 `ID,Name,Type,Status`，
        字段经 `encoding/csv` 转义；以 `= + - @` 或制表符 / CR 开头的字段会加**前导单引号**，
        防 Excel 公式注入（DDE）。
        其他取值 → 返回 JSON（`data` 为资产数组）。

        导出**全部资产**（本端点无过滤参数；无行数上限、不分页），按 `created_at` 倒序，
        同刻按 `id` 倒序 —— 保证产物可 diff。响应头 `X-Total-Count` = 数据行数（不含表头），
        `Content-Length` = 完整字节数：两者都供调用方自校验「收到的内容是完整的」。
        CSV 分支先写满内存缓冲再一次性发出：取数失败返回 500 且**不带** CSV 头，不会产出半截文件。
        注意：本端点有独立限流（10 次/分钟 per IP），比其余端点更紧。
      operationId: exportAssets
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [csv, json], default: csv }
          description: csv（默认）= 附件；其他任意值 = JSON 数组
      responses:
        '200':
          description: |
            `format=csv` 时是 `text/csv` 附件（非 JSON）；否则为 JSON 信封。
          headers:
            X-Total-Count:
              description: 本次导出的数据行数（不含 CSV 表头）。CSV 与 JSON 两个分支都会返回。
              schema: { type: integer }
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Asset' }
        '500':
          description: 查询失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /assets/{id}/retire:
    post:
      tags: [资产管理]
      summary: 软退役资产（释放 IP）
      description: |
        退役动作（单事务）：把各网卡的 IP 移到 `asset.last_known_ip4/ip6`，**清空网卡的 IP 字段**，
        置 `status='retired'` 并记 `retired_at` / `retired_reason` / `retired_by`。
        释放出的 IP 可被新设备使用，历史仍按 hostid 可查。

        `reason` 可省略。资产已退役 / id 非法 → 400；不存在 → 404。

        ⚠️ 本操作把 `status` 置为 `retired`，但 `Asset.status` 的 enum 当前**不含该值**
        —— 既有契约漂移（同 `offline`），已登记为独立缺陷，不在本轮修。
      operationId: retireAsset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: 退役原因，写入 retired_reason }
      responses:
        '200':
          description: 已退役
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetRetireResult'
        '400':
          description: 无法退役（资产已退役 / 参数无效）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资产不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /assets/{id}/restore:
    post:
      tags: [资产管理]
      summary: 恢复软退役资产（写回 IP）
      description: |
        逆操作：把 `last_known_ip4/ip6` 写回网卡，清空 `retired_*`，置 `status='active'`。
        资产未处于退役状态 → 400；不存在 → 404。无请求体。
      operationId: restoreAsset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 已恢复
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetRestoreResult'
        '400':
          description: 无法恢复（资产未处于退役状态）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资产不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ==================== 资产诊断 ====================
    TimelineEvent:
      type: object
      properties:
        ts:
          type: string
          format: date-time
        kind:
          type: string
          enum: [alert, ticket, status_change, link_change]
        sub_kind:
          type: string
        severity:
          type: integer
        title:
          type: string
        description:
          type: string
        ref_id:
          type: string
          format: uuid
        ref_table:
          type: string
    DiagnosticAsset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        asset_tag:
          type: string
        asset_type:
          type: string
        brand:
          type: string
        model:
          type: string
        status:
          type: string
        site_id:
          type: string
          format: uuid
        site_name:
          type: string
        rack_id:
          type: string
          format: uuid
        rack_name:
          type: string
    DiagnosticSummary:
      type: object
      properties:
        alert_count:
          type: integer
        ticket_count:
          type: integer
        open_alerts:
          type: integer
        open_tickets:
          type: integer
        last_offline:
          type: string
          format: date-time
        last_online:
          type: string
          format: date-time
        mttr_seconds:
          type: integer
          nullable: true
        link_down_count:
          type: integer
        window_days:
          type: integer
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        asset_id:
          type: string
          format: uuid
    DiagnosticTimeline:
      type: object
      properties:
        asset:
          $ref: '#/components/schemas/DiagnosticAsset'
        events:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'
        summary:
          $ref: '#/components/schemas/DiagnosticSummary'

    PingResult:
      type: object
      properties:
        host:
          type: string
        count:
          type: integer
        transmitted:
          type: integer
        received:
          type: integer
        loss_percent:
          type: number
        min_ms:
          type: number
        avg_ms:
          type: number
        max_ms:
          type: number
        stddev_ms:
          type: number
        duration_ms:
          type: integer
          format: int64

    TracerouteResult:
      type: object
      properties:
        host:
          type: string
        max_hops:
          type: integer
        reached:
          type: boolean
        duration_ms:
          type: integer
          format: int64
        hops:
          type: array
          items:
            $ref: '#/components/schemas/TracerouteHop'

    TracerouteHop:
      type: object
      properties:
        hop:
          type: integer
        host:
          type: string
        ip:
          type: string
        rtts:
          type: array
          items:
            type: string
        lossed:
          type: boolean

    # ==================== 告警抑制 ====================
    AlertSuppression:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        severity_max:
          type: integer
        host_pattern:
          type: string
        time_window_seconds:
          type: integer
        ttl_seconds:
          type: integer
        enabled:
          type: boolean
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SuppressionMatchResult:
      type: object
      properties:
        suppressed:
          type: boolean
        matched_rule:
          type: string
          format: uuid
        reason:
          type: string
        last_fired_at:
          type: string
          format: date-time
        window_expires_at:
          type: string
          format: date-time

    # ==================== 网络拓扑 ====================
    TopologyNode:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        asset_tag:
          type: string
        asset_type:
          type: string
        brand:
          type: string
        status:
          type: string
        open_alerts:
          type: integer
        is_virtual:
          type: boolean
        connected_assets:
          type: integer
        position_x:
          type: number
        position_y:
          type: number
    TopologyEdge:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
        target:
          type: string
        interface_name:
          type: string
        status:
          type: string
        speed:
          type: integer
        purpose:
          type: string
    TopologyStats:
      type: object
      properties:
        total_nodes:
          type: integer
        total_edges:
          type: integer
        nodes_with_alert:
          type: integer
        down_edges:
          type: integer
        virtual_nodes:
          type: integer
        window_days:
          type: integer
    TopologyGraph:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TopologyNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/TopologyEdge'
        stats:
          $ref: '#/components/schemas/TopologyStats'
        generated_at:
          type: string
          format: date-time

    # ==================== 值班 + 升级 ====================
    OncallSchedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        timezone:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OncallShift:
      type: object
      properties:
        id:
          type: string
          format: uuid
        schedule_id:
          type: string
          format: uuid
        user_id:
