          application/json:
            schema: { $ref: '#/components/schemas/Runbook' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Runbook' }
        '400': { description: 参数错误 }
  /runbooks/recommend:
    get:
