name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 四个 job 都只需要读仓库；显式收紧默认 token 权限
permissions:
  contents: read

# actions/* 统一在 v7（2026-09-10 从 checkout@v4 / setup-go@v5 / setup-node@v4 /
# upload-artifact@v4 升上来）。旧版跑在 Node 20 上，GitHub 已标记 deprecated：
# 每次运行都报 "Node.js 20 is deprecated ... forced to run on Node.js 24" —— 现在
# 只是被强制兜住仍能跑通，等兜底层撤掉就会直接红。v7 的 runs.using 是 node24，
# 要求 runner ≥ 2.327.1（托管 runner 早已满足）。
# 升级面：checkout v6 起凭据持久化到单独文件、v7 拦 fork PR 的 pull_request_target
# checkout；setup-go v6 起 toolchain 选择逻辑变化；setup-node v5 起按 packageManager
# 字段自动开缓存、v6 起收窄为仅 npm；upload-artifact v7 新增 archive:false 直传。
# 本工作流全都不落在这些变更面上：无 git 写操作、无 packageManager 字段、
# go.mod 无 toolchain 指令、artifact 仍走 name+path。

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # 跟 go.mod 的 go 指令走（当前 1.25.0）。原先钉 1.21，而 go.mod 要求
          # 1.25.0 → 每次 CI 都靠 GOTOOLCHAIN=auto 额外下载 ~100MB 工具链，
          # 多一个网络失败点，且 pin 与实际编译版本不符。
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download modules
        working-directory: backend
        run: go mod download

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test
        working-directory: backend
        # M41: 加 -race flag 守门 DATA RACE. baseline race detector 抓过
        # eventbus.newID 的两步原子 race (已修). 任何后续 race regression
        # 会立刻让 CI 红.
        run: go test -race ./...

      - name: Build server
        working-directory: backend
        run: go build -o bin/server ./cmd/server

      - name: Build migrate CLI
        working-directory: backend
        run: go build -o bin/migrate ./cmd/migrate

      - name: Build seed CLI
        working-directory: backend
        run: go build -o bin/seed ./cmd/seed

      - name: Upload backend binaries
        uses: actions/upload-artifact@v7
        with:
          name: backend-binaries
          path: backend/bin/

  dbsmoke:
    name: Postgres smoke (migrations)
    runs-on: ubuntu-latest
    # 为什么单独一个 job: 只有「真 Postgres 上跑生产迁移执行器」能抓到 schema 漂移
    # 与迁移不可重入（DDL 已提交、版本未记录的重放窗口）。单测全绿也挡不住这类缺陷。
    # 两条路径: 空库全新安装 migrate.Up / 存量库(000001~000012)只应用 000013 之后的迁移 + 回滚。
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: smoke_pw
          POSTGRES_DB: itmanager_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # 跟 go.mod 的 go 指令走（当前 1.25.0）。原先钉 1.21，而 go.mod 要求
          # 1.25.0 → 每次 CI 都靠 GOTOOLCHAIN=auto 额外下载 ~100MB 工具链，
          # 多一个网络失败点，且 pin 与实际编译版本不符。
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # 外部模式要用 psql/createdb 造库与灌旧迁移；runner 镜像通常自带，
      # 缺了就装，避免 dbsmoke job 因环境差异变红。
      - name: Ensure psql client
        run: |
          if ! command -v psql >/dev/null || ! command -v createdb >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi

      - name: Migrations smoke (fresh install + legacy upgrade)
        env:
          SMOKE_PG_HOST: 127.0.0.1
          SMOKE_PG_PORT: '5432'
        run: scripts/db_smoke.sh

      # D-I 回归（变异审计 E4：三个 CLI 的 MigrationsFS 注入此前零自动化保护）。
      # 三个 CLI 在真 Postgres 上跑，走的是与 cmd/server 相同的迁移执行器。
      # 反证：去掉任一 CLI 的 database.SetMigrationsFS → 该 CLI 落到 gorm AutoMigrate 兜底，
      # 空库上不建种子角色（admin-bootstrap 报「未找到 admin 角色」）、已迁移库上与 DDL 漂移
      # （实测 insufficient arguments）→ 本步必红。
      - name: CLI 迁移路径回归（admin-bootstrap / set-role / seed）
        working-directory: backend
        env:
          NMP_DATABASE_HOST: 127.0.0.1
          NMP_DATABASE_PORT: '5432'
          NMP_DATABASE_USER: postgres
          NMP_DATABASE_PASSWORD: smoke_pw
          NMP_DATABASE_SSLMODE: disable
          NMP_AUTH_JWT_SECRET: ci-dummy-jwt-secret-at-least-32-bytes!!
          NMP_AUTH_API_KEY_PEPPER: ci-dummy-pepper-at-least-32-bytes!!
          FIRST_ADMIN_USERNAME: ciadmin
          FIRST_ADMIN_PASSWORD: 'CiSmokeP@ssw0rd-123'
        run: |
          set -euo pipefail
          q() { PGPASSWORD=smoke_pw psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -tAc "$1" "${@:2}"; }

          # ① admin-bootstrap：空库 → 注入的 MigrationsFS 跑完全部迁移并建出种子角色
          PGPASSWORD=smoke_pw createdb -h 127.0.0.1 -U postgres itmanager_cli_admin
          NMP_DATABASE_NAME=itmanager_cli_admin go run ./cmd/admin-bootstrap
          test "$(q "select count(*) from users where username='ciadmin'" itmanager_cli_admin)" = "1"

          # ② set-role：需要第二个 admin，否则触发防自锁守卫（「唯一管理员不许降级」）
          FIRST_ADMIN_USERNAME=ciadmin2 \
            NMP_DATABASE_NAME=itmanager_cli_admin go run ./cmd/admin-bootstrap
          SET_ROLE_USERNAME=ciadmin SET_ROLE_ROLE=auditor \
            NMP_DATABASE_NAME=itmanager_cli_admin go run ./cmd/set-role
          test "$(q "select count(*) from user_roles ur join roles r on r.id=ur.role_id where r.code='auditor'" itmanager_cli_admin)" = "1"
          SET_ROLE_USERNAME=ciadmin SET_ROLE_ROLE=admin \
            NMP_DATABASE_NAME=itmanager_cli_admin go run ./cmd/set-role
          test "$(q "select role from users where username='ciadmin'" itmanager_cli_admin)" = "admin"

          # ③ seed：另一个空库，验证演示数据路径可用。
          # G-20 后 seed 失败会以非零码退出（此前是静默 exit 0），所以这一步本身就是
          # 「资产能不能建出来」的门禁；再断言资产数与 jsonb 无 NULL。
          PGPASSWORD=smoke_pw createdb -h 127.0.0.1 -U postgres itmanager_cli_seed
          NMP_DATABASE_NAME=itmanager_cli_seed go run ./cmd/seed
          test "$(q "select count(*) from users where username='admin'" itmanager_cli_seed)" = "1"
          test "$(q "select count(*) from assets" itmanager_cli_seed)" -gt 0
          test "$(q "select count(*) from assets where tags is null or custom_fields is null" itmanager_cli_seed)" = "0"

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # jsdom@29（vitest 的 jsdom 环境）engines: ^20.19.0 || ^22.13.0 || >=24；
          # Node 18 下 require() ESM 直接抛错 → 单测步骤 3s 内 exit 1（CI 长期红）。
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Lint
        working-directory: frontend
        run: npm run lint
        continue-on-error: false

      # B1-3: 前端测试 (vitest) + 类型检查 (tsc) — 之前 CI 缺这两个步骤
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      # M3 审计 LOW-5：api.types.ts 是 openapi.yaml 的**生成物**，但渠道调用点全走
      # `any`（api.ts 的 createChannel(data: any)），改了 spec 忘记 `npm run gen:api`
      # 不会有任何测试变红。这里重生成并断言工作区无差异（openapi-typescript 版本在
      # package-lock.json 里钉死，输出确定性）。
      - name: OpenAPI 生成物漂移检查
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run gen:api
          git diff --exit-code -- src/services/api.types.ts

      - name: Unit tests
        working-directory: frontend
        run: npx vitest run

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/

  compose-config:
    name: Compose config
    runs-on: ubuntu-latest
    # 作用范围（实证收窄，见 docs/FIX-PLAN-COMPOSE-RUNTIME.md D-F）：
    #   `docker compose config -q` 只能抓 YAML 语法 / ${VAR:?} 缺值 / compose schema；
    #   它不 stat Dockerfile（指向不存在的文件也 exit 0），也不懂 NMP_ 语义（变量名拼错无感）。
    #   所以：Dockerfile 漂移靠下面的 test -f，env 名与 viper 键的对齐靠 backend 单测。
    # 不在这里 build/up：Go+Node 全量构建会给每次 push 加 3–5 分钟，
    # 编译由 backend/frontend job 覆盖、迁移由 dbsmoke 覆盖。
    steps:
      - uses: actions/checkout@v7

      - name: Dockerfile 存在性（G-9 回归）
        run: |
          set -euo pipefail
          test -f backend/Dockerfile
          test -f frontend/Dockerfile
          test -f backend/.dockerignore
          test -f frontend/.dockerignore

      - name: Render compose file
        env:
          NMP_DATABASE_PASSWORD: ci-dummy-password
          NMP_AUTH_JWT_SECRET: ci-dummy-jwt-secret-at-least-32-bytes!!
          NMP_AUTH_API_KEY_PEPPER: ci-dummy-pepper-at-least-32-bytes!!
        run: docker compose config -q
