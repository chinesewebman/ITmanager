name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 跟 go.mod 的 go 指令走（当前 1.25.0）。原先钉 1.21，而 go.mod 要求
          # 1.25.0 → 每次 CI 都靠 GOTOOLCHAIN=auto 额外下载 ~100MB 工具链，
          # 多一个网络失败点，且 pin 与实际编译版本不符。
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download modules
        working-directory: backend
        run: go mod download

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test
        working-directory: backend
        run: go test ./...

      - name: Build server
        working-directory: backend
        run: go build -o bin/server ./cmd/server

      - name: Build migrate CLI
        working-directory: backend
        run: go build -o bin/migrate ./cmd/migrate

      - name: Build seed CLI
        working-directory: backend
        run: go build -o bin/seed ./cmd/seed

      - name: Upload backend binaries
        uses: actions/upload-artifact@v4
        with:
          name: backend-binaries
          path: backend/bin/

  dbsmoke:
    name: Postgres smoke (migrations)
    runs-on: ubuntu-latest
    # 为什么单独一个 job: 只有「真 Postgres 上跑生产迁移执行器」能抓到 schema 漂移
    # 与迁移不可重入（DDL 已提交、版本未记录的重放窗口）。单测全绿也挡不住这类缺陷。
    # 两条路径: 空库全新安装 migrate.Up / 存量库(000001~000012)只应用 000013 + 回滚。
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: smoke_pw
          POSTGRES_DB: itmanager_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 跟 go.mod 的 go 指令走（当前 1.25.0）。原先钉 1.21，而 go.mod 要求
          # 1.25.0 → 每次 CI 都靠 GOTOOLCHAIN=auto 额外下载 ~100MB 工具链，
          # 多一个网络失败点，且 pin 与实际编译版本不符。
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # 外部模式要用 psql/createdb 造库与灌旧迁移；runner 镜像通常自带，
      # 缺了就装，避免 dbsmoke job 因环境差异变红。
      - name: Ensure psql client
        run: |
          if ! command -v psql >/dev/null || ! command -v createdb >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi

      - name: Migrations smoke (fresh install + legacy upgrade)
        env:
          SMOKE_PG_HOST: 127.0.0.1
          SMOKE_PG_PORT: '5432'
        run: scripts/db_smoke.sh

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # jsdom@29（vitest 的 jsdom 环境）engines: ^20.19.0 || ^22.13.0 || >=24；
          # Node 18 下 require() ESM 直接抛错 → 单测步骤 3s 内 exit 1（CI 长期红）。
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Lint
        working-directory: frontend
        run: npm run lint
        continue-on-error: false

      # B1-3: 前端测试 (vitest) + 类型检查 (tsc) — 之前 CI 缺这两个步骤
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npx vitest run

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
