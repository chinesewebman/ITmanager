# 主链（默认 `docker compose up -d` 只起这些）：
#   postgres → redis → api → web
#
# 环境变量：本文件用 ${VAR:?} 强制要求 .env 提供 secret，缺值直接报错退出
# （不再有 nmp123 这类硬编码凭据进仓库）。变量名必须与 backend 的 viper 键一致：
# NMP_ + 配置路径（`.` → `_`），如 database.password → NMP_DATABASE_PASSWORD。
# 参考 `.env.example`。
#
# 辅助系统（netbox/zabbix/glpi/graylog/elasticsearch/mongoDB）全部在 `aux` profile 下，
# 需 `docker compose --profile aux up -d` 显式拉起。原因：它们目前是占位凭据、
# 独立库也未初始化，默认拉起会失败并把已知凭据暴露到宿主。生产化见 TODO G-17。
#
# 日志轮转（TODO G-29）：Docker 默认的 json-file 驱动**不轮转**，日志在
# /var/lib/docker/containers/<id>/<id>-json.log 单调增长。api（访问日志 + 慢查询）
# 与 web（nginx access log）长期运行会把宿主盘写满，写满后 postgres 写入失败、
# 容器异常重启，且 `docker compose logs` 本身也不可用。故所有服务统一上限
# 10MB × 5 = 50MB/服务。运维说明见 08-部署运维.md §8.4.4。
#
# 注意锚点里必须自带 `logging:` 这一层：`<<:` 是把锚点的条目**平铺**进服务，
# 写成裸的 driver/options 会变成服务的顶层属性，`docker compose config` 直接报
# `Additional property driver is not allowed`。
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # PostgreSQL 数据库 (主数据库)
  postgres:
    <<: *default-logging
    image: timescale/timescaledb:latest-pg16
    container_name: nmp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nmp
      # 与 api 的 NMP_DATABASE_PASSWORD 同源同变量：避免「库密码改了、api 没改」
      POSTGRES_PASSWORD: ${NMP_DATABASE_PASSWORD:?必须在 .env 里设置（openssl rand -hex 32）}
      POSTGRES_DB: network_monitor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 只绑环回：`make deploy` 的 db-migrate/db-seed 在**宿主机**上跑，需要连
      # localhost:5432；不绑 0.0.0.0 是为了避免无 TLS 的库暴露到局域网。
      # 容器内互访走服务名，与这个映射无关。
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nmp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    <<: *default-logging
    image: redis:7-alpine
    container_name: nmp-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    # 同样不发布端口：redis 无密码，绑宿主等于把可写缓存交出去。
    # （本机宿主已占用 6379，发布也起不来。）
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # 后端 API（启动时自动执行数据库迁移，见 docs/FIX-PLAN-COMPOSE-RUNTIME.md D-C）
  # 单副本约束：迁移用非阻塞 pg_try_advisory_lock，多副本冷启动时抢不到锁的副本会启动失败。
  api:
    <<: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nmp-api
    restart: unless-stopped
    ports:
      # 仅环回：给本机调试/smoke 用，不暴露到局域网（唯一对外入口是 web）
      - "127.0.0.1:8080:8080"
    environment:
      - NMP_SERVER_HOST=0.0.0.0
      # G-15 / M78：release 模式校验解耦（netbox / glpi 改 URL-aware）后，
      # compose 默认翻 release —— debug 下的「弱集成凭据不拒」/「登录 cookie
      # Secure 不开」两条都不再需要兜底。若集成真未启用，把对应 NMP_INTEGRATIONS_*_URL
      # 留空即可（详见 08-部署运维.md §8.3.2）。
      - NMP_SERVER_MODE=${NMP_SERVER_MODE:-release}
      - NMP_DATABASE_HOST=postgres
      - NMP_DATABASE_PORT=5432
      - NMP_DATABASE_USER=nmp
      - NMP_DATABASE_PASSWORD=${NMP_DATABASE_PASSWORD:?必须在 .env 里设置}
      - NMP_DATABASE_NAME=network_monitor
      - NMP_DATABASE_SSLMODE=disable
      # M88 / G-14: 多副本部署契约. 默认 false: api 副本跳过 migrate.Up,
      # 由下方独立的 one-shot `migrate` 服务跑迁移. 多副本冷启动 = 副本们各
      # 自连接 DB 不抢 advisory lock (详见 TODO.md L70 + D-C rev2 + intent-M88).
      # 单副本回滚路径: .env 覆盖 NMP_DATABASE_AUTOMIGRATE=true + 关掉 migrate 服务.
      - NMP_DATABASE_AUTOMIGRATE=${NMP_DATABASE_AUTOMIGRATE:-false}
      - NMP_REDIS_HOST=redis
      - NMP_INTEGRATIONS_NETBOX_URL=http://netbox:8000
      - NMP_INTEGRATIONS_ZABBIX_URL=http://zabbix-web:8080
      # M89 / G-17: 指向 zabbix-web (新增服务, 钉 zabbix-web-nginx-pgsql:7.0.13-alpine),
      # 原 zabbix-server 是 server 进程无 Web/API.
      - NMP_AUTH_JWT_SECRET=${NMP_AUTH_JWT_SECRET:?必须在 .env 里设置（openssl rand -hex 32）}
      - NMP_AUTH_API_KEY_PEPPER=${NMP_AUTH_API_KEY_PEPPER:?必须在 .env 里设置（openssl rand -hex 32）}
      # G-7: 只信任前端容器（下方 web 的静态 IP）。缺了它 ClientIP() 取直连对端
      # （即 nginx 容器 IP）→ 登录限流退化为全站单桶、审计 IP 失真、
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # M88 / G-14: 多副本部署契约. api 必须等 migrate one-shot 服务跑完再起,
      # 否则 api 副本 `database.automigrate=false` 起来后看到 schema_migrations 表不存在.
      migrate:
        condition: service_completed_successfully
    networks:
      default:
        # 别名只为兼容 frontend/nginx.conf 的 `proxy_pass http://backend:8080/api/`
        # （container_name 不注册 DNS，服务名才是 `api`）。不要删。
  # 一次性迁移服务 (M88 / G-14): 多副本部署前把迁移从 api 启动路径剥离.
  # 注意:
  #  1) cmd/migrate 走 config.LoadWithoutValidate (M88 加), 不需要 jwt/pepper/integrations
  #     token —— 本服务 env 故意**不**含 NMP_AUTH_* / NMP_INTEGRATIONS_*.
  #  2) restart: "no" — 一次跑完即退, 失败也不自愈 (让运维立即看到, 不静默起 api).
  #  3) 默认 profile (无 profiles: [...]): `docker compose up -d` 自动跑.
  #     关闭: `docker compose stop migrate` 或 `docker compose up -d --scale migrate=0`.
  #  4) service_completed_successfully (上方 api 的 depends_on) 要求容器 exit 0;
  #     migrate 跑完正常返 0, 任何迁移失败 exit 非 0 → compose 阻断 api 启动.
  # 详见 TODO.md L70 + docs/FIX-PLAN-COMPOSE-RUNTIME.md D-C (M88 加注) + intent-M88-candidate.md.
  # 多副本部署: `docker compose up -d --scale api=N` —— api 副本们各
  # 自连接 DB 不抢 advisory lock, 仅当 N=1 时 migrate 也能跟 api 同 pod 跑 (但不推荐).
  migrate:
    <<: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nmp-migrate
    restart: "no"
    command: ["./migrate", "up"]
    environment:
      # server.mode = debug: migrate 不走 release 校验 (略过 integrations 校验分支).
      - NMP_SERVER_HOST=0.0.0.0
      - NMP_SERVER_MODE=debug
      - NMP_DATABASE_HOST=postgres
      - NMP_DATABASE_PORT=5432
      - NMP_DATABASE_USER=nmp
      - NMP_DATABASE_PASSWORD=${NMP_DATABASE_PASSWORD:?必须在 .env 里设置}
      - NMP_DATABASE_NAME=network_monitor
      - NMP_DATABASE_SSLMODE=disable
      # LoadWithoutValidate 不强制 NMP_AUTH_*, 但 server 启动仍会读 trusted_proxies.
      # 默认空 = 不信任任何来源 (与 G-7 一致); 本服务只跑 migrate, 不接 HTTP, 安全无差.
      - NMP_SERVER_TRUSTED_PROXIES=
    depends_on:
      postgres:
        condition: service_healthy


  # 前端（G-19 / M77：unprivileged + 容器级硬化）
  web:
    <<: *default-logging
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nmp-web
    restart: unless-stopped
    ports:
      # G-19：unprivileged nginx 默认 8080（不能绑 < 1024），对外提供的是明文 HTTP，
      # 仍只绑环回 —— TLS 终结放宿主反代/LB（127.0.0.1:3000 → web:8080），
      # 或改绑 0.0.0.0 + 套 nginx-tls.conf.example（见 08-部署运维.md §8.2.2；
      # TLS 模板用 root 镜像，挂载时切回 nginx:1.27-alpine）。
      - "127.0.0.1:3000:8080"
    # G-19：容器级硬化。read_only + tmpfs 让 nginx 仍能写 cache/pid/temp，
    # 但进程内即便被攻陷也写不进镜像层；cap_drop ALL 砍掉不需要的特权；
    # no-new-privileges 防 setuid 二进制提权。
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=16m
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # G-7: 固定 IP，供 api 的 NMP_SERVER_TRUSTED_PROXIES 精确指向（只信任这一个容器，
    # 不信任整个子网 —— 同网段还有 postgres/redis/netbox，任一被攻陷即可伪造 XFF）。
    networks:
      default:
        ipv4_address: 172.28.0.10
    depends_on:
      api:
        condition: service_healthy

  # ---------------- 以下为 aux profile（docker compose --profile aux up -d）----------------
  #
  # G-17 / M89 ship 后的 aux 收紧契约 (4 条致命缺陷 + 网络隔离):
  #   ① image tag 全部钉精确次版本 + 补丁号 (`:latest` / `:6.0` / `:7` 移除)
  #   ② 占位值 (SECRET_KEY / GRAYLOG_PASSWORD_SECRET / ...) 全部 `${VAR:?...}` fail-closed
  #   ③ elasticsearch `xpack.security.enabled=true` 默认开
  #   ④ 与主链 default 网络 (`172.28.0.0/24`) 隔离 → 新增 `aux_net` (`172.29.0.0/24`)
  # 详见 TODO.md L73 + intent-M89-candidate.md.

  # NetBox (资产管理) — G-17/M89: 钉死补丁号 + SECRET_KEY 强制注入 fail-closed
  netbox:
    <<: *default-logging
    image: netboxcommunity/netbox:v4.0.3
    container_name: nmp-netbox
    profiles: ["aux"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_NAME=netbox
      - DB_USER=nmp
      - DB_PASSWORD=${NMP_DATABASE_PASSWORD:?}
      - REDIS_HOST=redis
      # G-17 / M89: 占位值字面 "your-secret-key-here-change-in-production" 改 ${VAR:?...} 强制注入.
      # 缺值 compose 直接报错退出, 拒绝起任何 aux 服务 (fail-closed).
      - SECRET_KEY=${NMP_AUX_NETBOX_SECRET_KEY:?必须在 .env.aux 里设置（openssl rand -hex 32）}
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:8000/api/"]
      interval: 30s
      timeout: 10s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # G-17 / M89: 留 default 网络 (api 集成通过 http://netbox:8000 DNS 访问).
    # aux_net 仅 graylog / elasticsearch / mongoDB 三个用 (G-17 第③层 graylog 栈隔离).

  # Zabbix Server (trapper 10051) — G-17/M89: 钉死补丁号
  zabbix:
    <<: *default-logging
    image: zabbix/zabbix-server-pgsql:7.0.13-alpine
    container_name: nmp-zabbix
    profiles: ["aux"]
    environment:
      - DB_SERVER_HOST=postgres
      - POSTGRES_USER=nmp
      - POSTGRES_PASSWORD=${NMP_DATABASE_PASSWORD:?}
      - POSTGRES_DB=zabbix
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 10051 || exit 1"]
      interval: 30s
    depends_on:
      postgres:
        condition: service_healthy
    # G-17 / M89: 留 default 网络 (zabbix-web 反代连它).
  # Zabbix Web/API 前端 (nginx + php-fpm) — G-17/M89: 这是 api 侧 NMP_INTEGRATIONS_ZABBIX_URL
  # 真正应该指向的服务 (原 zabbix image 是 server 进程无 Web/API, 集成目标不对).
  # 与 zabbix-server 必须同主版本号 (当前同钉 7.0.13-alpine).
  zabbix-web:
    <<: *default-logging
    image: zabbix/zabbix-web-nginx-pgsql:7.0.13-alpine
    container_name: nmp-zabbix-web
    profiles: ["aux"]
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - ZBX_SERVER_HOST=zabbix
      - ZBX_SERVER_PORT=10051
      - DB_SERVER_HOST=postgres
      - POSTGRES_USER=nmp
      - POSTGRES_PASSWORD=${NMP_DATABASE_PASSWORD:?}
      - POSTGRES_DB=zabbix
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ -o /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    depends_on:
      zabbix:
        condition: service_healthy
    # G-17 / M89: 留 default 网络 (api 集成通过 http://zabbix-web:8080 DNS 访问).


  # GLPI (工单) — G-17/M89: 钉死补丁号
  glpi:
    <<: *default-logging
    image: linuxserver/glpi:3.0.11
    container_name: nmp-glpi
    profiles: ["aux"]
    ports:
      - "127.0.0.1:8001:80"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
    volumes:
      - glpi_config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/ -o /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy
    # G-17 / M89: 留 default 网络 (api 集成通过 http://glpi:80 DNS 访问).


  # Graylog (日志) — G-17/M89: 钉死次版本+补丁号 + 三个 secret 占位值全 fail-closed
  graylog:
    <<: *default-logging
    image: graylog/graylog:6.0.3-1
    container_name: nmp-graylog
    profiles: ["aux"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:5044:5044"
      - "127.0.0.1:5140:5140"
      - "127.0.0.1:5555:5555"
    environment:
      # G-17 / M89: 占位字面 "your-password-secret-here" 改 ${VAR:?...} 强制注入.
      - GRAYLOG_PASSWORD_SECRET=${NMP_AUX_GRAYLOG_PASSWORD_SECRET:?必须在 .env.aux 里设置（openssl rand -hex 32）}
      # G-17 / M89: 占位字面 "your-hashed-password" (graylog 启动期 SHA2 校验会发现非法) 改 ${VAR:?...}.
      # SHA2 = echo -n "$NMP_AUX_GRAYLOG_ROOT_PASSWORD" | sha256sum | cut -d' ' -f1 (见 .env.example).
      - GRAYLOG_ROOT_PASSWORD_SHA2=${NMP_AUX_GRAYLOG_ROOT_PASSWORD_SHA2:?必须 sha256sum <root_password> 得出}
      # G-17 / M89: 原状缺此 secret (graylog 6.x 必须), 加 ${VAR:?...} 强制注入.
      - GRAYLOG_ROOT_PASSWORD=${NMP_AUX_GRAYLOG_ROOT_PASSWORD:?必须在 .env.aux 里设置（首次登录用）}
      - GRAYLOG_HTTP_EXTERNAL_URI=http://localhost:9000
      # G-17 / M89: xpack on 后必须带 user:pass (graylog ↔ es 都在 aux_net 内, 内网认证即可).
      - GRAYLOG_ELASTICSEARCH_HOSTS=http://nmp:${NMP_AUX_ELASTICSEARCH_PASSWORD:?必须在 .env.aux 里设置}@elasticsearch:9200
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/liveness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    depends_on:
      elasticsearch:
        condition: service_healthy
      mongoDB:
        condition: service_healthy
    networks:
      # G-17 / M89: graylog 仅接 aux_net (与 default 隔离), 端口仍 publish 给宿主调试.
      # aux_net 在网络级 internal=true (见 networks.aux_net.internal) → es/mongoDB 仅 graylog 可达.
      - aux_net


  # Elasticsearch (Graylog 依赖) — G-17/M89: 钉死补丁号 + xpack.security 默认开
  elasticsearch:
    <<: *default-logging
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.4
    container_name: nmp-elasticsearch
    profiles: ["aux"]
    environment:
      - discovery.type=single-node
      # G-17 / M89: 默认开 (原 false 是占位不安全默认值, ES 8.x 必须显式声明).
      - xpack.security.enabled=true
      # G-17 / M89: 加 ELASTIC_PASSWORD ${VAR:?...} 强制注入.
      - ELASTIC_PASSWORD=${NMP_AUX_ELASTICSEARCH_PASSWORD:?必须在 .env.aux 里设置（openssl rand -hex 32）}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u nmp:${NMP_AUX_ELASTICSEARCH_PASSWORD:?必须在 .env.aux 里设置} http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=10s || exit 1"]
      interval: 20s
      timeout: 15s
    networks:
      # G-17 / M89: graylog 栈全部在 aux_net (与主链 default 隔离).
      # graylog ↔ es ↔ mongoDB 通过 aux_net 互连; es + mongoDB 在网络级标 internal
      # (见下方 networks.aux_net.internal: true) → 阻断外部入口.
      - aux_net

  # MongoDB (Graylog 依赖) — G-17/M89: 钉死补丁号

  mongoDB:
    <<: *default-logging
    image: mongo:7.0.14
    container_name: nmp-mongodb
    profiles: ["aux"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      # G-17 / M89: graylog 栈全部在 aux_net (与主链 default 隔离).
      # graylog ↔ es ↔ mongoDB 通过 aux_net 互连; aux_net 在网络级标 internal (见下方)
      # → 阻断外部入口 (graylog 是唯一入口).
      - aux_net

networks:
  # G-7: 固定子网，让 web 容器拿到可预期的静态 IP（172.28.0.10）。
  # 选 172.28.0.0/24 是为了避开 AWS 默认 VPC 的 172.31.0.0/16。
  # 注意：① 若该网络已存在且未带 ipam 配置，需先 `docker compose down` 再起；
  # ② 宿主机若已有其它网络占用 172.28.0.0/24（`docker network ls` 自查），
  #    会以「Pool overlaps」直接起不来，换一个冷门网段即可；
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # G-17 / M89: aux profile 网络隔离 (与主链 default 完全独立).
  # 子网 172.29.0.0/24 避开 172.28.0.0/24 (主链, G-7) 与 172.31.0.0/16 (AWS VPC).
  # internal=true 阻断外部入口 (es / mongoDB 仅 graylog 可达).
  aux_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24


volumes:
  postgres_data:
  redis_data:
  glpi_config:
  elasticsearch_data:
  mongodb_data:
