# 主链（默认 `docker compose up -d` 只起这些）：
#   postgres → redis → api → web
#
# 环境变量：本文件用 ${VAR:?} 强制要求 .env 提供 secret，缺值直接报错退出
# （不再有 nmp123 这类硬编码凭据进仓库）。变量名必须与 backend 的 viper 键一致：
# NMP_ + 配置路径（`.` → `_`），如 database.password → NMP_DATABASE_PASSWORD。
# 参考 `.env.example`。
#
# 辅助系统（netbox/zabbix/glpi/graylog/elasticsearch/mongoDB）全部在 `aux` profile 下，
# 需 `docker compose --profile aux up -d` 显式拉起。原因：它们目前是占位凭据、
# 独立库也未初始化，默认拉起会失败并把已知凭据暴露到宿主。生产化见 TODO G-17。
#
# 日志轮转（TODO G-29）：Docker 默认的 json-file 驱动**不轮转**，日志在
# /var/lib/docker/containers/<id>/<id>-json.log 单调增长。api（访问日志 + 慢查询）
# 与 web（nginx access log）长期运行会把宿主盘写满，写满后 postgres 写入失败、
# 容器异常重启，且 `docker compose logs` 本身也不可用。故所有服务统一上限
# 10MB × 5 = 50MB/服务。运维说明见 08-部署运维.md §8.4.4。
#
# 注意锚点里必须自带 `logging:` 这一层：`<<:` 是把锚点的条目**平铺**进服务，
# 写成裸的 driver/options 会变成服务的顶层属性，`docker compose config` 直接报
# `Additional property driver is not allowed`。
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # PostgreSQL 数据库 (主数据库)
  postgres:
    <<: *default-logging
    image: timescale/timescaledb:latest-pg16
    container_name: nmp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nmp
      # 与 api 的 NMP_DATABASE_PASSWORD 同源同变量：避免「库密码改了、api 没改」
      POSTGRES_PASSWORD: ${NMP_DATABASE_PASSWORD:?必须在 .env 里设置（openssl rand -hex 32）}
      POSTGRES_DB: network_monitor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 只绑环回：`make deploy` 的 db-migrate/db-seed 在**宿主机**上跑，需要连
      # localhost:5432；不绑 0.0.0.0 是为了避免无 TLS 的库暴露到局域网。
      # 容器内互访走服务名，与这个映射无关。
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nmp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    <<: *default-logging
    image: redis:7-alpine
    container_name: nmp-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    # 同样不发布端口：redis 无密码，绑宿主等于把可写缓存交出去。
    # （本机宿主已占用 6379，发布也起不来。）
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # 后端 API（启动时自动执行数据库迁移，见 docs/FIX-PLAN-COMPOSE-RUNTIME.md D-C）
  # 单副本约束：迁移用非阻塞 pg_try_advisory_lock，多副本冷启动时抢不到锁的副本会启动失败。
  api:
    <<: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nmp-api
    restart: unless-stopped
    ports:
      # 仅环回：给本机调试/smoke 用，不暴露到局域网（唯一对外入口是 web）
      - "127.0.0.1:8080:8080"
    environment:
      - NMP_SERVER_HOST=0.0.0.0
      # 生产必须显式设 release：debug 下弱集成凭据不会被启动期拒绝、
      # 登录 cookie 的 Secure 也不会开。当前默认 debug 的原因见 R-5（G-15 解耦后可翻）。
      - NMP_SERVER_MODE=${NMP_SERVER_MODE:-debug}
      - NMP_DATABASE_HOST=postgres
      - NMP_DATABASE_PORT=5432
      - NMP_DATABASE_USER=nmp
      - NMP_DATABASE_PASSWORD=${NMP_DATABASE_PASSWORD:?必须在 .env 里设置}
      - NMP_DATABASE_NAME=network_monitor
      - NMP_DATABASE_SSLMODE=disable
      - NMP_REDIS_HOST=redis
      - NMP_INTEGRATIONS_NETBOX_URL=http://netbox:8000
      - NMP_INTEGRATIONS_ZABBIX_URL=http://zabbix:8080
      - NMP_INTEGRATIONS_GLPI_URL=http://glpi:80
      - NMP_AUTH_JWT_SECRET=${NMP_AUTH_JWT_SECRET:?必须在 .env 里设置（openssl rand -hex 32）}
      - NMP_AUTH_API_KEY_PEPPER=${NMP_AUTH_API_KEY_PEPPER:?必须在 .env 里设置（openssl rand -hex 32）}
      # G-7: 只信任前端容器（下方 web 的静态 IP）。缺了它 ClientIP() 取直连对端
      # （即 nginx 容器 IP）→ 登录限流退化为全站单桶、审计 IP 失真、
      # IP 白名单 API Key 一律 403。见 docs/FIX-PLAN-TRUSTED-PROXY.md。
      # 可被 .env 覆盖：scripts/smoke-compose.sh 的负例就靠覆盖它验证
      # 「配错 → ClientIP() 退化为直连对端（nginx 容器 IP）」。
      - NMP_SERVER_TRUSTED_PROXIES=${NMP_SERVER_TRUSTED_PROXIES:-172.28.0.10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      default:
        # 别名只为兼容 frontend/nginx.conf 的 `proxy_pass http://backend:8080/api/`
        # （container_name 不注册 DNS，服务名才是 `api`）。不要删。
        aliases: [backend]

  # 前端
  web:
    <<: *default-logging
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nmp-web
    restart: unless-stopped
    ports:
      # 只绑环回：本容器提供的是**明文 HTTP**（nginx.conf 是 listen 80），
      # 绑 0.0.0.0 等于把未加密的登录入口暴露到局域网（与 PCI DSS 的 TLS 1.2+ 要求冲突）。
      # 对外提供必须前置 TLS 终结：宿主机反代/LB 指向 127.0.0.1:3000，
      # 或改绑 0.0.0.0 并挂载 frontend/nginx-tls.conf.example（见 08-部署运维.md §8.2.2）。
      - "127.0.0.1:3000:80"
    # G-7: 固定 IP，供 api 的 NMP_SERVER_TRUSTED_PROXIES 精确指向（只信任这一个容器，
    # 不信任整个子网 —— 同网段还有 postgres/redis/netbox，任一被攻陷即可伪造 XFF）。
    networks:
      default:
        ipv4_address: 172.28.0.10
    depends_on:
      api:
        condition: service_healthy

  # ---------------- 以下为 aux profile（docker compose --profile aux up -d）----------------

  # NetBox (资产管理)
  netbox:
    <<: *default-logging
    image: netboxcommunity/netbox:v4.0
    container_name: nmp-netbox
    profiles: ["aux"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_NAME=netbox
      - DB_USER=nmp
      - DB_PASSWORD=${NMP_DATABASE_PASSWORD:?}
      - REDIS_HOST=redis
      - SECRET_KEY=your-secret-key-here-change-in-production
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:8000/api/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Zabbix (监控)
  # 注意：这是 zabbix-server 进程，没有 Web/API；api 侧的 ZABBIX_URL 需要
  # zabbix-web-nginx-pgsql（见 08-部署运维.md §8.3）。
  zabbix:
    <<: *default-logging
    image: zabbix/zabbix-server-pgsql:latest
    container_name: nmp-zabbix
    profiles: ["aux"]
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - DB_SERVER_HOST=postgres
      - POSTGRES_USER=nmp
      - POSTGRES_PASSWORD=${NMP_DATABASE_PASSWORD:?}
      - POSTGRES_DB=zabbix
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 10051 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy

  # GLPI (工单)
  glpi:
    <<: *default-logging
    image: linuxserver/glpi:latest
    container_name: nmp-glpi
    profiles: ["aux"]
    ports:
      - "127.0.0.1:8001:80"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
    volumes:
      - glpi_config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/ -o /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy

  # Graylog (日志)
  graylog:
    <<: *default-logging
    image: graylog/graylog:6.0
    container_name: nmp-graylog
    profiles: ["aux"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:5044:5044"
      - "127.0.0.1:5140:5140"
      - "127.0.0.1:5555:5555"
    environment:
      - GRAYLOG_PASSWORD_SECRET=your-password-secret-here
      - GRAYLOG_ROOT_PASSWORD_SHA2=your-hashed-password
      - GRAYLOG_HTTP_EXTERNAL_URI=http://localhost:9000
      - GRAYLOG_ELASTICSEARCH_HOSTS=elasticsearch:9200
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/liveness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    depends_on:
      elasticsearch:
        condition: service_healthy
      mongoDB:
        condition: service_healthy

  # Elasticsearch (Graylog 依赖)
  elasticsearch:
    <<: *default-logging
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: nmp-elasticsearch
    profiles: ["aux"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=10s || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 60s

  # MongoDB (Graylog 依赖)
  mongoDB:
    <<: *default-logging
    image: mongo:7
    container_name: nmp-mongodb
    profiles: ["aux"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  # G-7: 固定子网，让 web 容器拿到可预期的静态 IP（172.28.0.10）。
  # 选 172.28.0.0/24 是为了避开 AWS 默认 VPC 的 172.31.0.0/16。
  # 注意：① 若该网络已存在且未带 ipam 配置，需先 `docker compose down` 再起；
  # ② 宿主机若已有其它网络占用 172.28.0.0/24（`docker network ls` 自查），
  #    会以「Pool overlaps」直接起不来，换一个冷门网段即可；
  # ③ 静态 IP 与 `--scale web=2` 互斥（第二个副本地址冲突）。
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres_data:
  redis_data:
  glpi_config:
  elasticsearch_data:
  mongodb_data:
